[project]
name = "roboscope-backend"
version = "0.1.0"
description = "RoboScope: express assessment of facility robotization (LCT 2026, task 1)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "C4", "RUF", "ASYNC", "S", "DTZ", "PT", "RET", "N"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Cyrillic text in UI strings and docstrings is intended
  "PLR2004",                     # magic values in comparisons: enforced by test_no_magic_numbers in engine/
  "S101",                        # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "PLR0913"]
"migrations/**" = ["E501"]
# Route handlers receive their dependencies as parameters; FastAPI DI makes long signatures idiomatic.
"app/api/v1/**" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-statements = 40

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.engine.*", "app.service.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres and Redis (make test-infra)"]
