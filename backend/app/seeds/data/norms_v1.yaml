norms:
  - key: amr_utilization_target
    name: Целевая загрузка AMR
    value: 0.8
    unit: доля
    category: sizing
    range: {min: 0.7, max: 0.85}
    source: dataset_legend
    rationale: "Легенда датасета: типовой KPI загрузки AMR 70–85%, берём середину. В нашей модели загрузка — доля занятости в доступное время (ожидание, разъезды); зарядка и отказы учитываются отдельно доступностью и в имитации. Это строже легенды, где зарядка входит в загрузку, и даёт консервативное число роботов."
    affects: [robot_count, capex, opex, payback, npv, roi, sla]
    editable_by_user: true
    object_types: [warehouse, airport, hospital]
  - key: fleet_reserve_share
    name: Резерв парка к пиковой потребности
    value: 0.15
    unit: доля
    category: sizing
    range: {min: 0.15, max: 0.2}
    source: dataset_legend
    rationale: "Легенда датасета: робот рассчитывается на пиковую нагрузку с резервом 15–20%. Берём нижнюю границу как стартовую, потому что итоговый резерв подтверждается стресс-тестом имитации (отказ робота, +20% объёма) и может быть поднят до 20%."
    affects: [robot_count, capex, opex, payback, npv, roi, sla]
    editable_by_user: true
    object_types: [warehouse, airport, hospital]
  - key: load_handling_time_s
    name: Время захвата груза
    value: 30
    unit: с
    category: sizing
    range: {min: 15, max: 45}
    source: team
    rationale: "Подъезд к точке, доводка по QR/лидару, подъём платформы или ввод вил под паллету. Вендоры каталога время захвата не публикуют. 30 с — консервативная оценка для паллеты 1200×800; диапазон для чувствительности."
    affects: [robot_count, sla]
    editable_by_user: true
    object_types: [warehouse, airport, hospital]
  - key: unload_handling_time_s
    name: Время отдачи груза
    value: 30
    unit: с
    category: sizing
    range: {min: 15, max: 45}
    source: team
    rationale: "Симметрично захвату: позиционирование в точке выгрузки, опускание платформы, отъезд. Данных вендоров нет, допущение проверяется замером на пилоте."
    affects: [robot_count, sla]
    editable_by_user: true
    object_types: [warehouse, airport, hospital]
  - key: fork_lift_cycle_extra_s
    name: Доп. время FMR на подъём к ярусу стеллажа
    value: 60
    unit: с
    category: sizing
    range: {min: 30, max: 120}
    source: team
    rationale: "Подъём и опускание вил на ярус 4–6 м при скорости подъёма автономных штабелёров порядка 0,2–0,3 м/с плюс точная доводка к ячейке. Вендоры скорость подъёма не публикуют; для высоких ярусов (до 7–11 м у RoboCV) брать верх диапазона."
    affects: [robot_count, sla]
    editable_by_user: true
    object_types: [warehouse]
  - key: effective_speed_factor
    name: Коэффициент эффективной скорости
    value: 0.6
    unit: доля
    category: sizing
    range: {min: 0.5, max: 0.75}
    source: team
    rationale: "Отношение средней скорости на маршруте к паспортной максимальной: разгон и торможение, повороты, перекрёстки, зоны совместной работы с людьми с ограничением скорости. Уже в кейсе Ronavi H1500 реальная скорость 1,3 м/с против 1,5 м/с по спецификации (research/catalog_specs), а это ещё без поворотов и остановок. Имитация уточняет значение на планировке."
    affects: [robot_count, sla]
    editable_by_user: true
    object_types: [warehouse, airport, hospital]
  - key: battery_min_charge_share
    name: Порог уровня заряда для постановки на зарядку
    value: 0.2
    unit: доля
    category: operations
    range: {min: 0.15, max: 0.3}
    source: ronavi_catalogue
    rationale: "Ronavi указывает автономность при разряде с 80% до 20%, т.е. рабочее окно батареи 20–80%. Порог 20% совпадает с паспортным режимом вендора."
    affects: [robot_count, sla]
    editable_by_user: true
    object_types: [warehouse, airport, hospital]
  - key: analytic_availability_default
    name: Доступность робота по умолчанию (нет данных о работе и зарядке)
    value: 0.75
    unit: доля
    category: sizing
    range: {min: 0.7, max: 0.92}
    source: fcbas_warehouse_amr
    rationale: "Методика ФЦ БАС, каталог AMR (с. 8–9): Ronavi H1500 — 240 мин работы на 80 мин зарядки, т.е. 240 / 320 = 0,75; МОРОС AMR1500 — 1320/120, т.е. 0,92. Если у продукта нет данных о работе и зарядке, берём худшее значение из таблицы заказчика."
    affects: [robot_count, capex, sla]
    editable_by_user: true
    object_types: [warehouse, airport, hospital]
  - key: charger_efficiency
    name: КПД зарядки
    value: 0.9
    unit: доля
    category: opex
    range: {min: 0.85, max: 0.95}
    source: team
    rationale: "Потери в зарядной станции и батарее: энергия из сети = энергия, отданная роботом / КПД. Для LiFePO4 с импульсными зарядными устройствами типично 85–95%; берём середину."
    affects: [opex, effect, payback, npv]
    editable_by_user: false
    object_types: [warehouse, airport, hospital]
  - key: transport_default_one_way_distance_m
    name: Средний пробег робота в одну сторону (нет планировки)
    value: 200
    unit: м
    category: sizing
    range: {min: 100, max: 400}
    source: fcbas_warehouse_amr
    rationale: "Модельный кейс ФЦ БАС (с. 5): средний пробег робота от точки погрузки до точки отгрузки паллеты 200 м. Используется только когда длина маршрута не получена из сгенерированной планировки."
    affects: [robot_count, sla]
    editable_by_user: true
    object_types: [warehouse]
  - key: airport_default_route_length_m
    name: Средняя длина маршрута в терминале (нет планировки)
    value: 700
    unit: м
    category: sizing
    range: {min: 300, max: 1500}
    source: team
    rationale: "В датасете аэропорта нет длин маршрутов (docs/DATA.md, ловушки). Терминал 85 000 м² в двух корпусах ≈ 42 500 м² на корпус, т.е. размер порядка 300 × 140 м; маршрут «сортировка багажа — стоянка/гейт» с обходом зон — 500–1000 м. Проверяется по реальному генплану."
    affects: [robot_count, sla]
    editable_by_user: true
    object_types: [airport]
  - key: g2p_station_lines_per_hour
    name: Производительность станции «товар к человеку»
    value: 300
    unit: строк/ч
    category: sizing
    range: {min: 250, max: 600}
    source: pick_rate_benchmarks
    rationale: "Бенчмарки отбора: goods-to-person 300–600 строк/ч на станцию против 60–120 при ручном отборе. Берём нижнюю границу (консервативно): в датасете уже 150 строк/ч на отборщика, т.е. выигрыш x2, а не x4."
    affects: [robot_count, labor_savings, effect, payback, npv]
    editable_by_user: true
    object_types: [warehouse]
  - key: g2p_robot_lines_per_trip
    name: Строк отбора за один подвоз стеллажа
    value: 3
    unit: строк/рейс
    category: sizing
    range: {min: 1.5, max: 6}
    source: team
    rationale: "Сколько строк отбирают из одного подвезённого стеллажа или контейнера за визит на станцию. Зависит от числа SKU на стеллаже и группировки заказов; при 2000 SKU и доле A-класса 20% (датасет) берём умеренные 3 строки. Главный драйвер числа G2P-роботов, поэтому в торнадо."
    affects: [robot_count, capex, sla]
    editable_by_user: true
    object_types: [warehouse]
  - key: pick_assist_productivity_gain_share
    name: Прирост выработки отборщика с Pick-by-Light/Voice
    value: 0.2
    unit: доля
    category: sizing
    range: {min: 0.1, max: 0.67}
    source: team
