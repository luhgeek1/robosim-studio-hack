extra_solution_types:
  - key: uav
    name: "Беспилотная авиационная система"
    description: "Дроны мультироторного, самолётного и вертолётного типа: мониторинг, аэросъёмка, доставка, мойка фасадов."
    sizing_model: null
    capability_keys: []
  - key: marine_robot
    name: "Морской робот"
    description: "Безэкипажные катера, надводные платформы и телеуправляемые подводные аппараты."
    sizing_model: null
    capability_keys: []
  - key: agro_robot
    name: "Сельскохозяйственный робот"
    description: "Беспилотная сельхозтехника, сбор урожая, животноводство и системы автономного управления тракторами."
    sizing_model: null
    capability_keys: []
  - key: construction_robot
    name: "Строительная и дорожная робототехника"
    description: "Беспилотная дорожная техника, строительные 3D-принтеры, демонтажные роботы, управление кранами."
    sizing_model: null
    capability_keys: []
  - key: inspection_robot
    name: "Инспекционный робот"
    description: "Внутритрубная диагностика, контроль сварных швов, обследование подземной инфраструктуры."
    sizing_model: null
    capability_keys: []
  - key: industrial_arm
    name: "Промышленный манипулятор или роботизированная ячейка"
    description: "Манипуляторы и ячейки для сварки, обслуживания станков, сборки и укладки на производстве."
    sizing_model: null
    capability_keys: []
  - key: humanoid_robot
    name: "Антропоморфный робот"
    description: "Человекоподобные роботы для общения с посетителями и пилотных сценариев."
    sizing_model: null
    capability_keys: []
  - key: passenger_transport
    name: "Беспилотный пассажирский транспорт"
    description: "Беспилотные такси, трамваи и поезда метро."
    sizing_model: null
    capability_keys: []
  - key: road_offroad_vehicle
    name: "Беспилотный грузовой транспорт для дорог и бездорожья"
    description: "Магистральные тягачи, внедорожные грузовики и платформы для труднодоступных районов."
    sizing_model: null
    capability_keys: []
  - key: last_mile_delivery
    name: "Робот-доставщик последней мили"
    description: "Уличные роботы доставки заказов до подъезда или двери."
    sizing_model: null
    capability_keys: []
  - key: retail_automation
    name: "Роботизированная торговля и общепит"
    description: "Робо-кафе, фудтраки и мобильные вендинговые автоматы."
    sizing_model: null
    capability_keys: []
  - key: railway_robot
    name: "Робот для железнодорожной инфраструктуры"
    description: "Расцепка вагонов, отпуск тормозов, обслуживание путей."
    sizing_model: null
    capability_keys: []
  - key: medical_robot
    name: "Медицинский робототехнический комплекс"
    description: "Реабилитационные и медицинские комплексы, не связанные с логистикой учреждения."
    sizing_model: null
    capability_keys: []
  - key: special_purpose_robot
    name: "Специальный робот"
    description: "Спасательные, пожарные, экологические и прочие роботы специального назначения."
    sizing_model: null
    capability_keys: []
