    solution_types: [delivery_robot, amr_transport]
    message: Грузоподъёмность меньше отходов, которые забираются из одной точки за один вывоз
    why_needed: Нужна грузоподъёмность, чтобы проверить, заберёт ли робот отходы одной точки за один вывоз — {required} кг
      (суточные отходы ÷ точек сбора ÷ вывозов в сутки)
