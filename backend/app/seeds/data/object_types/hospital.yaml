checks:
- key: meal_portions_match_beds
  expression: meal_portions_per_day <= beds * bed_occupancy_pct * feedings_per_day
  severity: warning
  params: [meal_portions_per_day, feedings_per_day, beds, bed_occupancy_pct]
  message: Порций питания больше, чем коек × занятость × кормлений в сутки
  how_to_fix: 'Проверьте число порций: возможно, оно посчитано на все койки без учёта занятости. Расчёт спроса идёт по формуле'
- key: cleaning_area_within_total
  expression: cleaning_area_m2 <= area_m2
  severity: error
  params: [cleaning_area_m2, area_m2]
  message: Площадь уборки больше общей площади зданий
  how_to_fix: Укажите площадь коридоров и холлов, которые убираются
- key: class_b_waste_below_class_a
  expression: waste_class_b_kg_per_day <= waste_class_a_kg_per_day
  severity: info
  params: [waste_class_b_kg_per_day, waste_class_a_kg_per_day]
  message: Опасных отходов класса Б больше, чем неопасных класса А — так бывает редко
  how_to_fix: Проверьте объёмы отходов по журналу учёта
