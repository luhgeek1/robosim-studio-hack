  hint: За сколько минут питание должно попасть от пищеблока в отделение (санитарные правила и технологическая карта).
  example: '20'
  affects: [meal_delivery]
  order: 21
  default: null
- key: linen_dirty_kg_per_day
  group: linen
  name: Грязного белья в сутки
  type: number
  unit: кг/сут
  required: true
  dataset_row: Объём грязного белья (кг/сутки)
  step: null
  enum_values: null
  hint: Сколько килограммов грязного белья вывозится из отделений за сутки. Ориентир — 2,5–3,5 кг на койку.
