- {key: hospital_demo_01, name: 'Многопрофильная больница на 650 коек, 9 этажей (данные организатора)', description: 'Демо-объект
    с листа «Медучреждение» датасета организатора: 45 000 м², 4 лифта, 1 200 проб и 340 заявок на медикаменты в сутки, 111
    сотрудников на внутрибольничной логистике.'}
site_costs:
- key: capex_integration
  kind: capex
  name: Интеграция с МИС
  formula: wms_integration_rub
  solution_types: [delivery_robot, amr_transport, tow_tractor]
  note: Датасет больницы — МИС есть; доставщики получают заявки из МИС.
- key: capex_access_control
  kind: capex
  name: Интеграция роботов со СКУД отделений
  formula: has_access_control * medication_delivery_points * access_point_integration_rub
  solution_types: [delivery_robot, amr_transport, tow_tractor]
  note: Датасет — «интеграция роботов через API дверей»; дверь с контролем доступа на каждую точку доставки (22 по датасету).
    Если СКУД нет, статья равна нулю.
- key: capex_elevators
  kind: capex
  name: Интеграция роботов с лифтами
  formula: elevators * (elevator_integration_rub_per_elevator - elevator_control * (elevator_integration_rub_per_elevator - elevator_api_connection_rub))
  solution_types: [delivery_robot, amr_transport, tow_tractor]
  note: Лифты управляются через API — подключение программное; иначе (в датасете BMS «частично») IoT-модуль вызова на каждый
    лифт.
- key: capex_wifi
  kind: capex
  name: Модернизация Wi-Fi под роботов
  formula: wifi_upgrade_rub
  solution_types: [amr_transport, fmr_forklift, tow_tractor, autonomous_truck, goods_to_person, sorting_robot, inventory_robot, cleaning_robot, delivery_robot, service_robot]
- key: capex_training
  kind: capex
  name: Обучение персонала
  formula: training_rub
- key: opex_connectivity
  kind: opex
  name: Связь и удалённый доступ вендора
  formula: connectivity_rub_per_year
- key: opex_disinfection
  kind: opex
  name: Расходники на обеззараживание роботов
  formula: robot_disinfection * waste_points * waste_pickups_per_day * working_days_per_year * disinfection_consumables_rub_per_trip
  solution_types: [delivery_robot, amr_transport, tow_tractor]
  note: Датасет — обеззараживание «учитывается в OPEX». Рейсы вывоза отходов — точки сбора × вывозов в сутки × дней в году.
descriptive_params:
  facility_type: Тип учреждения по ТЗ 3.2.1 идентифицирует объект в отчёте; модель процессов одна — многопрофильный стационар
    с койками, питанием, бельём и отходами, поэтому тип не меняет формулы.
  inpatient_schedule: Режим работы стационара в датасете — строка «24/7/365»; в расчёт он входит числами «Часов работы в сутки»
    и «Рабочих дней в году», сама строка — для отчёта.
