  example: '0.95'
  affects: [meal_delivery, medication_delivery, lab_sample_delivery]
  order: 64
  default:
    value: 0.95
    status: assumption
    rationale: 'В датасете и ТЗ нет. То же допущение команды, что и для склада: 95 % доставок в срок — рабочая цель уровня
      сервиса; сами нормативы времени (питание 20 мин, пробы 30 мин) взяты из датасета. Пользователь меняет значение.'
labor_groups:
- {key: orderlies, name: Санитары и транспортировщики, headcount_param: orderlies, salary_param: orderly_salary_rub_month}
- {key: kitchen_staff, name: Сотрудники пищеблока (раздача), headcount_param: kitchen_staff, salary_param: kitchen_salary_rub_month}
- {key: laundry_staff, name: Сотрудники прачечной (перевозка белья), headcount_param: laundry_staff, salary_param: laundry_salary_rub_month}
processes:
- key: meal_delivery
  name: Доставка питания из пищеблока в отделения
  description: Робот везёт тележку с питанием от пищеблока до отделений, сам вызывает лифт. Норматив — «Норматив доставки
    питания» (meal_delivery_norm_min) из датасета.
  demand_unit: portion
  demand_formula: порций в сутки (≈ коек × занятость × кормлений); рейсов = точек раздачи × кормлений в сутки
  demand_params: [meal_portions_per_day, beds, bed_occupancy_pct, feedings_per_day, meal_points]
  sla: {kind: lead_time, target_value: 20, unit: мин}
  labor_groups: [kitchen_staff]
  solution_types: [delivery_robot, amr_transport, tow_tractor]
  sizing_model: elevator_cycle
- key: linen_transport
  name: Перевозка белья (чистое и грязное)
  description: Сбор грязного белья из отделений в прачечную и развоз чистого. Цель — «Смен белья в сутки» (linen_changes_per_day)
    в каждой точке.
  demand_unit: kg
  demand_formula: грязное + чистое бельё, кг/сут; рейсов ≈ кг ÷ масса контейнера
  demand_params: [linen_dirty_kg_per_day, linen_clean_kg_per_day, linen_container_weight_kg, linen_points]
  sla: {kind: coverage, target_value: 1.3, unit: раз/сут}
  labor_groups: [laundry_staff]
  solution_types: [delivery_robot, amr_transport, tow_tractor]
  sizing_model: elevator_cycle
- key: waste_transport
  name: Вывоз медицинских отходов
  description: Вывоз контейнеров с отходами классов А и Б из отделений; для класса Б — отдельный маршрут и обеззараживание
    робота. Цель — «Вывозов отходов из отделений в сутки» (waste_pickups_per_day) по СанПиН 2.1.3684-21.
  demand_unit: kg
  demand_formula: отходы класса А + класса Б, кг/сут; рейсов = точек сбора × вывозов в сутки
  demand_params: [waste_class_a_kg_per_day, waste_class_b_kg_per_day, waste_points, waste_pickups_per_day]
  sla: {kind: coverage, target_value: 2, unit: раз/сут}
  labor_groups: [orderlies]
  solution_types: [delivery_robot, amr_transport]
  sizing_model: elevator_cycle
- key: medication_delivery
  name: Доставка медикаментов и расходников
  description: Доставка собранных заявок из аптеки и расходных материалов в отделения; срочные доставки идут вне очереди.
    Цель — «Целевая доля доставок в срок» (sla_target_share).
  demand_unit: trip
  demand_formula: заявок на медикаменты + рейсов расходных материалов в сутки
  demand_params: [medication_orders_per_day, supply_trips_per_day, stat_delivery_pct]
  sla: {kind: on_time_share, target_value: 0.95, unit: доля}
  labor_groups: [orderlies]
  solution_types: [delivery_robot]
  sizing_model: elevator_cycle
- key: lab_sample_delivery
  name: Доставка проб в лабораторию
  description: Доставка биоматериалов от мест забора в лабораторию и развоз результатов. Норматив — «Норматив доставки пробы»
    (lab_delivery_norm_min) из датасета.
  demand_unit: item
  demand_formula: проб в сутки; плюс рейсов с результатами анализов
  demand_params: [lab_samples_per_day, lab_results_trips_per_day]
  sla: {kind: lead_time, target_value: 30, unit: мин}
  labor_groups: [orderlies]
  solution_types: [delivery_robot]
  sizing_model: elevator_cycle
- key: floor_cleaning
  name: Уборка коридоров и холлов
  description: Влажная уборка коридоров и холлов автономной поломоечной машиной. Цель — «Уборок в сутки» (cleaning_passes_per_day)
    по всей площади уборки.
  demand_unit: m2
  demand_formula: площадь уборки (если не задана — общая площадь зданий) × уборок в сутки, м²/сут
  demand_params: [cleaning_area_m2, area_m2, cleaning_passes_per_day]
  sla: {kind: coverage, target_value: 2, unit: раз/сут}
  labor_groups: [orderlies]
  solution_types: [cleaning_robot]
  sizing_model: area_coverage
