  demand: {per_day: waste_class_a_kg_per_day + waste_class_b_kg_per_day, hours_per_day: operating_hours_per_day, peak_factor: hospital_peak_factor, load_per_trip: (waste_class_a_kg_per_day + waste_class_b_kg_per_day) / (waste_points * waste_pickups_per_day)}
