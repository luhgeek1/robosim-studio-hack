key: hospital
name: Медицинское учреждение
description: 'Больница или поликлиника: доставка питания, белья, медикаментов и анализов между отделениями, вывоз отходов,
  уборка. Считается на базовом уровне: параметры, подбор и аналитическая экономика без имитации. Отрасли «Здравоохранение»
  в каталоге организатора нет; ближайшая — «Торговля и услуги», там роботы-уборщики и робот-курьер для помещений.'
industry: Торговля и услуги
depth: basic
dataset_sheet: Медучреждение
layout_templates: []
parameter_groups:
- {key: facility, name: Объект, order: 1}
- {key: operating_mode, name: Режим работы, order: 2}
- {key: meals, name: 'Логистика: питание', order: 3}
- {key: linen, name: 'Логистика: бельё', order: 4}
- {key: medication, name: 'Логистика: медикаменты и расходники', order: 5}
- {key: lab, name: 'Логистика: анализы и биоматериалы', order: 6}
- {key: waste, name: 'Логистика: отходы', order: 7}
- {key: cleaning, name: Уборка, order: 8}
- {key: staff, name: Персонал, order: 9}
- {key: sanitary, name: Безопасность и санитарные требования, order: 10}
- {key: infrastructure, name: Инфраструктура, order: 11}
- {key: economics, name: Цели и экономика, order: 12}
parameters:
- key: facility_type
  group: facility
  name: Тип медицинского учреждения
  type: enum
  unit: null
  required: true
  dataset_row: Тип медицинского учреждения
  step: null
  enum_values:
  - {value: multi_profile_hospital, label: Многопрофильная больница}
  - {value: polyclinic, label: Поликлиника}
  - {value: oncology_center, label: Онкоцентр}
  - {value: diagnostic_center, label: Диагностический центр}
  hint: Вид учреждения. От него зависят набор логистических процессов и режим работы.
  example: Многопрофильная больница
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery, floor_cleaning]
  order: 1
  default: null
- key: area_m2
  group: facility
  name: Общая площадь зданий
  type: number
  unit: м²
  required: true
  dataset_row: Общая площадь здания(й)
  step: null
  enum_values: null
  hint: Суммарная площадь всех корпусов. Влияет на длину маршрутов, число роботов и площадь уборки.
  example: '45000'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery, floor_cleaning]
  order: 2
  default: null
- key: floors
  group: facility
  name: Этажей в основном корпусе
  type: integer
  unit: шт.
  required: true
  dataset_row: Количество этажей (основной корпус)
  step: null
  enum_values: null
  hint: Сколько этажей в основном корпусе. От 5 этажей без лифтов роботу не обойтись.
  example: '9'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery]
  order: 3
  default: null
- key: elevators
  group: facility
  name: Грузовых и медицинских лифтов
  type: integer
  unit: шт.
  required: true
  dataset_row: Количество лифтов (грузовых/медицинских)
  step: null
  enum_values: null
  hint: Сколько лифтов могут возить тележки и роботов. Лифт — частое узкое место доставки.
  example: '4'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery]
  order: 4
  default: null
- key: beds
  group: facility
  name: Коек в стационаре
