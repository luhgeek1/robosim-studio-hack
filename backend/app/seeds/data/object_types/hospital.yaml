  affects: [meal_delivery]
  order: 15
  default: null
- key: meal_portions_per_day
  group: meals
  name: Порций питания в сутки
  type: integer
  unit: порций/сут
  required: true
  dataset_row: Общее количество порций питания в сутки
  step: null
  enum_values: null
  hint: 'Сколько порций раздаётся за сутки. Можно посчитать: коек × занятость × кормлений в сутки. В датасете 1 950 = 650
    × 3 без учёта занятости; по формуле 650 × 0,82 × 3 ≈ 1 599 порций. Организаторы на Q&A разрешили считать по своей формуле.
    Если есть фактическое число с пищеблока, введите его.'
  example: '1950'
  affects: [meal_delivery]
  order: 16
  default: null
- key: kitchen_to_ward_distance_m
