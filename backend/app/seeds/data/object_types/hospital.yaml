labor_groups:
- {key: orderlies, name: Санитары и транспортировщики, headcount_param: orderlies, salary_param: orderly_salary_rub_month}
- {key: kitchen_staff, name: Сотрудники пищеблока (раздача), headcount_param: kitchen_staff, salary_param: kitchen_salary_rub_month}
- {key: laundry_staff, name: Сотрудники прачечной (перевозка белья), headcount_param: laundry_staff, salary_param: laundry_salary_rub_month}
processes:
- key: meal_delivery
  name: Доставка питания из пищеблока в отделения
  description: Робот везёт тележку с питанием от пищеблока до отделений, сам вызывает лифт. Норматив — «Норматив доставки
    питания» (meal_delivery_norm_min) из датасета.
  demand_unit: portion
  demand_formula: 'коек × занятость × кормлений в сутки, порций/сут. Считаем по формуле, а не по строке «Общее количество
    порций питания в сутки»: в датасете 1 950 = 650 × 3 без учёта занятости, организаторы на Q&A разрешили считать по своей
    формуле. Строка датасета проверяется правилом meal_portions_match_beds.'
  demand_params: [feedings_per_day, beds, bed_occupancy_pct, operating_hours_per_day]
  demand: {per_day: beds * bed_occupancy_pct * feedings_per_day, hours_per_day: operating_hours_per_day, peak_factor: hospital_peak_factor, load_per_trip: beds * bed_occupancy_pct / meal_points}
  sla: {kind: lead_time, target_value: 20, unit: мин, target_param: meal_delivery_norm_min}
  labor_groups: [kitchen_staff]
  labor_allocation: {kitchen_staff: 1.0}
  labor_release: labor_release_share_transport * meal_transport_share
  labor_allocation_note: Вся группа «Сотрудники пищеблока (раздача)» относится к доставке питания. Датасет отмечает, что роботы
    заменяют только перевозку, — это учитывает доля высвобождения.
  solution_types: [delivery_robot, amr_transport, tow_tractor]
  sizing_model: elevator_cycle
  route_length: kitchen_to_ward_distance_m
  requirements:
  - key: payload_vs_meal_cart
    spec: payload_kg
    comparison: gte
    required: meal_cart_weight_kg
    unit: кг
    solution_types: [delivery_robot, amr_transport]
    message: Грузоподъёмность меньше массы тележку с питанием
    why_needed: Нужна грузоподъёмность, чтобы проверить, увезёт ли робот тележку с питанием массой {required} кг
  - key: towing_vs_meal_cart
    spec: towing_capacity_kg
    comparison: gte
    required: meal_cart_weight_kg
    unit: кг
    solution_types: [tow_tractor]
    message: Тягач не буксирует тележку с питанием
    why_needed: Нужна буксируемая масса, чтобы проверить, увезёт ли тягач тележку с питанием массой {required} кг
  - key: width_in_corridor
    spec: width_mm
    comparison: lte
    required: m_to_mm(corridor_width_m) - aisle_safety_clearance_mm
    unit: мм
    solution_types: []
    message: Робот шире, чем позволяет коридор с зазором для разъезда
    why_needed: 'Нужна ширина робота, чтобы проверить, пройдёт ли он по коридору с зазором безопасности: не шире {required}
      мм'
  - key: min_aisle_in_corridor
    spec: min_aisle_width_mm
    comparison: lte
    required: m_to_mm(corridor_width_m)
    unit: мм
    solution_types: []
    message: Роботу нужен проезд шире основных коридоров
    why_needed: 'Нужна минимальная ширина проезда робота, чтобы сравнить её с шириной коридоров: {required} мм'
  - key: night_noise
    spec: noise_dba
    comparison: lte
    required: night_noise_limit_dba
    unit: дБА
    solution_types: []
    message: Робот шумнее, чем допускается в палатах ночью
    why_needed: 'Нужен уровень шума робота: ночью в палатах допускается не больше {required} дБА'
  cycle_extras:
  - key: elevator_s
    name: Поездка на лифте (ожидание, вход, этажи)
    formula: coalesce(min_to_s(elevator_cycle_min), elevator_wait_transfer_s + floors * elevator_ride_floor_share * elevator_floor_travel_s)
- key: linen_transport
  name: Перевозка белья (чистое и грязное)
  description: Сбор грязного белья из отделений в прачечную и развоз чистого. Цель — «Смен белья в сутки» (linen_changes_per_day)
    в каждой точке.
  demand_unit: kg
  demand_formula: грязное + чистое бельё, кг/сут; рейсов ≈ кг ÷ масса контейнера
  demand_params: [linen_dirty_kg_per_day, linen_clean_kg_per_day, operating_hours_per_day]
  demand: {per_day: 'max(linen_dirty_kg_per_day + linen_clean_kg_per_day, linen_points * linen_min_visits_per_point_day * linen_container_weight_kg)', hours_per_day: operating_hours_per_day, peak_factor: hospital_peak_factor, load_per_trip: linen_container_weight_kg}
  sla: {kind: coverage, target_value: 1.3, unit: раз/сут}
  labor_groups: [laundry_staff]
  labor_allocation: {laundry_staff: 1.0}
  labor_release: labor_release_share_transport
  labor_allocation_note: Строка датасета «Численность сотрудников прачечной (транспорт белья)» уже описывает только перевозку
