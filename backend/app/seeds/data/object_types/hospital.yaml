key: hospital
name: Медицинское учреждение
description: 'Больница или поликлиника: доставка питания, белья, медикаментов и анализов между отделениями, вывоз отходов,
  уборка. Считается на базовом уровне: параметры, подбор и аналитическая экономика без имитации. Отрасли «Здравоохранение»
  в каталоге организатора нет; ближайшая — «Торговля и услуги», там роботы-уборщики и робот-курьер для помещений.'
industry: Торговля и услуги
depth: basic
dataset_sheet: Медучреждение
layout_templates: []
parameter_groups:
- {key: facility, name: Объект, order: 1, survey_hint: 'Сверить с поэтажным планом и техническим паспортом здания'}
- {key: operating_mode, name: Режим работы, order: 2, survey_hint: 'Взять график смен и табель учёта рабочего времени за 3 месяца'}
- {key: meals, name: 'Логистика: питание', order: 3, survey_hint: 'Хронометраж раздачи питания по отделениям за 3 дня'}
- {key: linen, name: 'Логистика: бельё', order: 4, survey_hint: 'Взять журнал прачечной: масса белья и рейсы за месяц'}
- {key: medication, name: 'Логистика: медикаменты и расходники', order: 5, survey_hint: 'Выгрузить из МИС заявки аптеки за месяц, включая срочные'}
- {key: lab, name: 'Логистика: анализы и биоматериалы', order: 6, survey_hint: 'Выгрузить из ЛИС число проб и время доставки за месяц'}
- {key: waste, name: 'Логистика: отходы', order: 7, survey_hint: 'Взять журнал учёта медицинских отходов за месяц'}
- {key: cleaning, name: Уборка, order: 8, survey_hint: 'Сверить с графиком и площадями клининговой службы'}
- {key: staff, name: Персонал, order: 9, survey_hint: 'Запросить у бухгалтерии численность и ФОТ с начислениями по группам за 12 месяцев'}
- {key: sanitary, name: Безопасность и санитарные требования, order: 10, survey_hint: 'Согласовать с эпидемиологом требования к маршрутам и обработке роботов'}
- {key: infrastructure, name: Инфраструктура, order: 11, survey_hint: 'Запросить у главного инженера схему электроснабжения, сети и интеграций'}
- {key: economics, name: Цели и экономика, order: 12, survey_hint: 'Согласовать с финансовой службой бюджет, горизонт и целевой уровень сервиса'}
parameters:
- key: facility_type
  group: facility
  name: Тип медицинского учреждения
  type: enum
  unit: null
  required: true
  dataset_row: Тип медицинского учреждения
  step: null
  enum_values:
  - {value: multi_profile_hospital, label: Многопрофильная больница}
  - {value: polyclinic, label: Поликлиника}
  - {value: oncology_center, label: Онкоцентр}
  - {value: diagnostic_center, label: Диагностический центр}
  hint: Вид учреждения. От него зависят набор логистических процессов и режим работы.
  example: Многопрофильная больница
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery, floor_cleaning]
  order: 1
  default: null
- key: area_m2
  group: facility
  name: Общая площадь зданий
  type: number
  unit: м²
  required: true
  dataset_row: Общая площадь здания(й)
  step: null
  enum_values: null
  hint: Суммарная площадь всех корпусов. Влияет на длину маршрутов, число роботов и площадь уборки.
  example: '45000'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery, floor_cleaning]
  order: 2
  default: null
- key: floors
  group: facility
  name: Этажей в основном корпусе
  type: integer
  unit: шт.
  required: true
  dataset_row: Количество этажей (основной корпус)
  step: null
  enum_values: null
  hint: Сколько этажей в основном корпусе. От 5 этажей без лифтов роботу не обойтись.
  example: '9'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery]
  order: 3
  default: null
- key: elevators
  group: facility
  name: Грузовых и медицинских лифтов
  type: integer
  unit: шт.
  required: true
  dataset_row: Количество лифтов (грузовых/медицинских)
  step: null
  enum_values: null
  hint: Сколько лифтов могут возить тележки и роботов. Лифт — частое узкое место доставки.
  example: '4'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery]
  order: 4
  default: null
- key: beds
