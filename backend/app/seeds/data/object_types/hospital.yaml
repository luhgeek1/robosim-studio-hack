  name: Коек в стационаре
  type: integer
  unit: коек
  required: true
  dataset_row: Количество коек (стационар)
  step: null
  enum_values: null
  hint: Число коек по штатному расписанию. Основа потребности в питании, белье и медикаментах.
  example: '650'
  affects: [meal_delivery, linen_transport, medication_delivery]
  order: 5
  default: null
- key: bed_occupancy_pct
  group: facility
  name: Средняя занятость коек
  type: number
  unit: '%'
  required: true
  dataset_row: Коечный фонд в эксплуатации (средняя занятость)
  step: null
  enum_values: null
  hint: Какая доля коек в среднем занята пациентами.
  example: '82'
  affects: [meal_delivery, linen_transport, medication_delivery]
  order: 6
  default: null
- key: operating_rooms
  group: facility
  name: Операционных
  type: integer
  unit: шт.
  required: false
  dataset_row: Количество операционных
  step: null
  enum_values: null
  hint: Сколько операционных. Доставка стерильных наборов и срочных медикаментов туда — приоритетная.
  example: '12'
  affects: [medication_delivery, linen_transport]
  order: 7
  default: null
- key: outpatient_visits_per_day
  group: facility
  name: Амбулаторных посещений в сутки
  type: integer
  unit: посещений/сут
  required: false
  dataset_row: Количество амбулаторных посещений в сутки
  step: null
  enum_values: null
  hint: Сколько пациентов поликлиники приходит за сутки. Влияет на число анализов.
  example: '850'
  affects: [lab_sample_delivery]
  order: 8
  default: null
- key: inpatient_schedule
  group: operating_mode
  name: Режим работы стационара
  type: string
  unit: null
  required: true
  dataset_row: Режим работы стационара
  step: null
  enum_values: null
  hint: Как работает стационар, например «24/7/365» — круглосуточно без выходных. Определяет требования к надёжности роботов.
  example: 24/7/365
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery, floor_cleaning]
  order: 9
  default: null
- key: outpatient_schedule
  group: operating_mode
  name: Режим работы поликлиники
  type: string
  unit: null
  required: false
  dataset_row: Режим работы амбулатории
  step: null
  enum_values: null
  hint: Дни и часы работы поликлиники, например «5/2, 08:00-20:00».
  example: 5/2, 08:00-20:00
  affects: [lab_sample_delivery]
  order: 10
  default: null
- key: operating_hours_per_day
  group: operating_mode
  name: Часов работы логистики в сутки
  type: number
  unit: ч/сут
  required: true
  dataset_row: null
  step: null
  enum_values: null
  hint: Сколько часов в сутки идёт доставка по больнице. Нужно для расчёта часовой нагрузки.
  example: '24'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery, floor_cleaning]
  order: 11
  default:
    value: 24
    status: assumption
    rationale: Числового поля в датасете нет; значение выведено из строки датасета «Режим работы стационара» = «24/7/365»
      (круглосуточно).
- key: working_days_per_year
  group: operating_mode
  name: Рабочих дней в году
  type: integer
  unit: дн.
  required: true
  dataset_row: null
  step: null
  enum_values: null
  hint: Сколько дней в году работает стационар.
  example: '365'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery, floor_cleaning]
  order: 12
  default:
    value: 365
    status: assumption
    rationale: Числового поля в датасете нет; значение выведено из строки датасета «Режим работы стационара» = «24/7/365»
      (365 дней в году).
- key: nursing_shifts_per_day
  group: operating_mode
  name: Смен медперсонала в сутки
  type: integer
  unit: смен/сут
  required: false
  dataset_row: Количество смен медперсонала (уход за пациентами)
  step: null
  enum_values: null
  hint: 'Сколько смен в сутки у персонала: 3 смены по 8 ч или 2 по 12 ч.'
  example: '3'
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery]
  order: 13
  default: null
- key: logistics_peak_hours
  group: operating_mode
  name: Часы пиковой логистической нагрузки
  type: string
  unit: null
  required: false
  dataset_row: Пиковое время логистической нагрузки
  step: null
  enum_values: null
  hint: 'В какие часы больше всего перевозок: завтрак, обед, смена белья, приём анализов.'
  example: 07:00-10:00 и 15:00-17:00
  affects: [meal_delivery, linen_transport, waste_transport, medication_delivery, lab_sample_delivery]
  order: 14
  default: null
- key: scheduled_peak_factor
  group: operating_mode
  name: Пиковый коэффициент плановых работ
  type: number
  unit: null
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Во сколько раз самый загруженный час плановых работ (уборка) больше среднего. Плановые работы идут по расписанию,
    поэтому обычно 1.
  example: '1'
  affects: [floor_cleaning]
  order: 15
  default:
    value: 1
    status: assumption
    rationale: 'Плановые работы (уборка) идут по расписанию и распределены по рабочему времени равномерно, поэтому пика нет:
      коэффициент 1 означает «пиковый час равен среднему». Отдельный параметр нужен, потому что формулы расчёта не допускают
      чисел без источника.'
- key: feedings_per_day
  group: meals
  name: Кормлений в сутки
  type: integer
  unit: раз/сут
  required: true
  dataset_row: Количество кормлений в сутки
  step: null
  enum_values: null
