key: warehouse
name: Склад
description: 'Распределительный или фулфилмент-склад: приёмка паллет, хранение, отбор заказов, сортировка, отгрузка. Считается
  в полной глубине: подбор, количество роботов, экономика, 2D-имитация и отчёт.'
industry: Торговля и услуги
depth: full
dataset_sheet: Склад
layout_templates: [warehouse_standard]
parameter_groups:
- {key: facility, name: Объект, order: 1}
- {key: operating_mode, name: Режим работы, order: 2}
- {key: operations, name: 'Операции: объём и производительность', order: 3}
- {key: staff, name: Персонал, order: 4}
- {key: layout, name: Маршруты и планировка, order: 5}
- {key: storage, name: Хранение и характеристики грузов, order: 6}
- {key: infrastructure, name: Инфраструктура и ограничения, order: 7}
- {key: economics, name: Цели и экономика, order: 8}
parameters:
- key: area_m2
  group: facility
  name: Общая площадь склада
  type: number
  unit: м²
  required: true
  dataset_row: Общая площадь склада
  step: null
  enum_values: null
  hint: Площадь всего склада по техпаспорту или договору аренды, включая зоны приёмки, хранения и отгрузки.
  example: '20000'
  affects: [pallet_transport, inventory_count, floor_cleaning]
  order: 1
  default: null
- key: robotized_area_m2
  group: facility
  name: Площадь зоны, где будут работать роботы
  type: number
  unit: м²
  required: true
  dataset_row: Площадь активной (роботизируемой) зоны
  step: null
  enum_values: null
  hint: 'Часть склада, куда планируется допустить роботов: проезды, зона хранения, отбора. Если не знаете — возьмите примерно
    половину общей площади.'
  example: '10000'
  affects: [pallet_transport, order_picking, high_bay_storage]
  order: 2
  default: null
- key: ceiling_height_m
  group: facility
  name: Высота потолков в зоне хранения
  type: number
  unit: м
  required: true
  dataset_row: Высота потолков в зоне хранения
  step: null
  enum_values: null
  hint: Высота от пола до нижней точки перекрытия или балок. Определяет, подойдёт ли высотное хранение (шаттлы, краны-штабелёры)
    и до какой высоты поднимать паллету.
  example: '10'
  affects: [high_bay_storage, inventory_count]
  order: 3
  default: null
- key: floors
  group: facility
  name: Количество этажей и мезонинов
  type: integer
  unit: шт.
  required: true
  dataset_row: Количество этажей (мезонинов)
  step: null
  enum_values: null
  hint: Сколько уровней, по которым перемещается груз. Больше одного — нужны лифты или подъёмники, это увеличивает затраты
    на внедрение.
  example: '1'
  affects: [pallet_transport, order_picking, floor_cleaning]
  order: 4
  default: null
- key: main_aisle_width_m
  group: facility
  name: Ширина главных проездов
  type: number
  unit: м
  required: true
  dataset_row: Ширина главных проездов
  step: null
  enum_values: null
  hint: Ширина основных транспортных проездов между зонами склада в самом узком месте. Ограничивает габарит робота и возможность
    разъехаться двум машинам.
  example: '3.5'
  affects: [pallet_transport, high_bay_storage, floor_cleaning]
  order: 5
  default: null
- key: aisle_width_m
  group: facility
  name: Ширина рабочих проходов между стеллажами
  type: number
  unit: м
  required: true
  dataset_row: Ширина рабочих проходов между стеллажами
  step: null
  enum_values: null
  hint: Расстояние между стеллажами в самом узком месте. Проход 1,5–2 м подходит только для узкопроходной техники.
  example: '2.8'
  affects: [pallet_transport, order_picking, high_bay_storage, inventory_count, floor_cleaning]
  order: 6
  default: null
- key: floor_type
  group: facility
  name: Тип напольного покрытия
  type: enum
  unit: null
  required: false
  dataset_row: Тип напольного покрытия
  step: null
  enum_values:
  - {value: industrial_concrete, label: Промышленный бетон}
  - {value: epoxy, label: Эпоксидное покрытие}
  - {value: asphalt, label: Асфальт}
  hint: Материал пола в зоне работы роботов. Влияет на выбор колёс и на то, сможет ли робот ездить по полу.
  example: Промышленный бетон
  affects: [pallet_transport, high_bay_storage, floor_cleaning]
  order: 7
  default: null
- key: floor_flatness_mm
  group: facility
  name: Ровность пола
  type: number
  unit: мм/2м
  required: false
  dataset_row: Ровность пола (отклонение)
  step: null
  enum_values: null
  hint: 'Максимальный перепад высоты пола на отрезке 2 м (по DIN 15185 или классу FM2). Критично для высотных систем и складских
    роботов: при большом перепаде нужна шлифовка пола.'
  example: '3'
  affects: [pallet_transport, high_bay_storage, inventory_count]
  order: 8
  default: null
- key: min_temperature_c
  group: facility
  name: Минимальная температура в зоне работы роботов
  type: number
  unit: °C
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Самая низкая температура воздуха в зоне, где будут ездить роботы (зимой, у открытых ворот, в холодильной камере).
    Многие складские роботы работают только в отапливаемом помещении. Если поле пустое, подбор пометит роботов как «требует
    проверки».
  example: '5'
  affects: [pallet_transport, high_bay_storage, inventory_count, floor_cleaning]
  order: 9
  default: null
- key: shifts_per_day
  group: operating_mode
  name: Количество рабочих смен в сутки
  type: integer
  unit: смен
  required: true
  dataset_row: Количество рабочих смен в сутки
  step: null
  enum_values: null
  hint: Сколько смен в сутки работает склад.
  example: '2'
  affects: [pallet_transport, order_picking, high_bay_storage, parcel_sorting, inventory_count, floor_cleaning]
  order: 10
  default: null
- key: working_days_per_year
  group: operating_mode
  name: Рабочих дней в году
  type: integer
  unit: дн.
  required: true
  dataset_row: Рабочих дней в году
  step: null
  enum_values: null
  hint: Сколько дней в году склад принимает и отгружает товар. Круглогодичный склад — 365.
  example: '365'
  affects: [pallet_transport, order_picking, high_bay_storage, parcel_sorting, inventory_count, floor_cleaning]
  order: 11
  default: null
- key: shift_hours
  group: operating_mode
  name: Продолжительность смены
  type: number
  unit: ч
  required: true
  dataset_row: Продолжительность смены
  step: null
  enum_values: null
  hint: Чистое рабочее время одной смены без обеда и технических пауз. В примечании датасета сказано «2 смены по 12 ч», но
    в значении 11 ч — используем значение 11 ч, так как оно уже учитывает перерывы.
  example: '11'
  affects: [pallet_transport, order_picking, high_bay_storage, parcel_sorting, inventory_count, floor_cleaning]
  order: 12
  default: null
- key: peak_factor
  group: operating_mode
  name: Пиковый коэффициент нагрузки
  type: number
  unit: null
  required: true
  dataset_row: Пиковый коэффициент нагрузки
  step: null
  enum_values: null
  hint: 'Во сколько раз самый загруженный час больше среднего. Посчитать: максимум паллет или строк за час из WMS, делённый
    на средний час. Для интернет-торговли — до 2,5. Роботов подбираем под пик.'
  example: '1.5'
  affects: [pallet_transport, order_picking, high_bay_storage, parcel_sorting]
  order: 13
  default: null
- key: scheduled_peak_factor
  group: operating_mode
  name: Пиковый коэффициент плановых работ
  type: number
  unit: null
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Во сколько раз самый загруженный час плановых работ (уборка, инвентаризация) больше среднего. Плановые работы идут
    по расписанию, поэтому обычно 1.
  example: '1'
  affects: [inventory_count, floor_cleaning]
  order: 14
  default:
    value: 1
    status: assumption
    rationale: 'Плановые работы (уборка, инвентаризация) идут по расписанию и распределены по рабочему времени равномерно,
      поэтому пика нет: коэффициент 1 означает «пиковый час равен среднему». Отдельный параметр нужен, потому что формулы
      расчёта не допускают чисел без источника.'
- key: pallets_in_per_day
  group: operations
  name: Приёмка паллет в сутки
  type: integer
  unit: поддон/сут
  required: true
  dataset_row: Объём приёмки (поддоны/сутки)
  step: null
  enum_values: null
  hint: Сколько паллет в среднем принимается за сутки (входящий поток). Берётся из WMS или журнала приёмки. Один европоддон
    — около 33 коробов.
  example: '1000'
  affects: [pallet_transport, high_bay_storage]
  order: 15
  default: null
- key: pallets_out_per_day
  group: operations
  name: Отгрузка паллет в сутки
  type: integer
  unit: поддон/сут
  required: true
  dataset_row: Объём отгрузки (поддоны/сутки)
  step: null
  enum_values: null
  hint: Сколько паллет в среднем отгружается за сутки, включая собранные из заказов (консолидация).
  example: '1000'
  affects: [pallet_transport, high_bay_storage, parcel_sorting]
  order: 16
  default: null
- key: pallets_internal_per_day
  group: operations
  name: Внутрискладские перемещения паллет в сутки
  type: integer
  unit: поддон/сут
  required: true
  dataset_row: null
  step: null
  enum_values: null
  hint: 'Перемещения внутри склада, не связанные с приёмкой и отгрузкой: пополнение зоны отбора, перестановка между ячейками,
    перевозка в зону упаковки. Возьмите из WMS число задач на перемещение за сутки.'
  example: '300'
  affects: [pallet_transport]
  order: 17
  default:
    value: 0
    status: assumption
    rationale: В датасете организатора нет внутрискладских перемещений, а ТЗ 3.2.1 требует этот объём. Пока нет замера, считаем
      0, чтобы не завышать потребность в роботах; поле попадает в список «что уточнить при обследовании» (задачи на перемещение
      в WMS за сутки).
- key: order_lines_per_day
  group: operations
  name: Строк отбора в сутки
  type: integer
  unit: строк/сут
  required: true
  dataset_row: Объём отбора (строк/сутки, всего)
  step: null
  enum_values: null
  hint: Строка — одна позиция в заказе, сколько бы штук в ней ни было. Главный показатель для отбора заказов, берётся из WMS.
  example: '100000'
  affects: [order_picking]
  order: 18
  default: null
- key: pieces_per_day
  group: operations
  name: Штук отбора в сутки
  type: integer
  unit: шт./сут
  required: false
  dataset_row: Объём отбора (штук/сутки, всего)
  step: null
  enum_values: null
  hint: Сколько штук товара отбирается за сутки. Обычно около 1,5 штуки на строку.
  example: '150000'
  affects: [order_picking]
  order: 19
  default: null
- key: piece_pick_pct
  group: operations
  name: Доля мелкоштучного отбора
  type: number
  unit: '%'
  required: false
  dataset_row: Доля мелкоштучного отбора (piece-pick)
  step: null
  enum_values: null
  hint: Какая часть отбора — поштучная (остальное — коробами или паллетами). Поштучный отбор лучше всего роботизируется системами
    «товар к человеку».
  example: '30'
  affects: [order_picking]
  order: 20
  default: null
- key: sku_count
  group: operations
  name: Количество активных товарных позиций (SKU)
  type: integer
  unit: SKU
  required: true
  dataset_row: Количество SKU (активных)
  step: null
  enum_values: null
  hint: Сколько разных артикулов реально хранится и отбирается. Влияет на маршруты и размещение товара.
  example: '2000'
  affects: [order_picking, high_bay_storage, inventory_count]
  order: 21
  default: null
- key: a_class_sku_pct
  group: operations
  name: Доля быстро оборачиваемых позиций (класс A)
  type: number
  unit: '%'
  required: false
  dataset_row: Доля SKU с быстрым оборотом (A-класс)
  step: null
  enum_values: null
  hint: Какая часть артикулов даёт основную долю отбора (ABC-анализ). Чем выше концентрация, тем короче маршруты.
  example: '20'
  affects: [order_picking]
  order: 22
  default: null
- key: boxes_per_pallet
  group: operations
  name: Коробов на одной паллете
  type: number
  unit: короб/поддон
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Сколько коробов в среднем на отгружаемой паллете. Нужно, чтобы оценить поток коробов на сортировку.
  example: '33'
  affects: [parcel_sorting]
  order: 23
  default:
    value: 33
    status: assumption
    rationale: 'Примечание датасета организатора к строке «Объём приёмки (поддоны/сутки)»: «1 европоддон ≈ 33 короба». Отдельной
      строки в датасете нет, поэтому берём число из примечания.'
- key: inventory_counts_per_year
  group: operations
  name: Полных инвентаризаций в год
  type: integer
  unit: раз/год
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Сколько раз в год пересчитываются все ячейки склада.
  example: '12'
  affects: [inventory_count]
  order: 24
  default:
    value: 12
    status: assumption
    rationale: 'В датасете нет. Методика ФЦ БАС «Инвентаризация складов» (research/fcbas_scenarios, PDF стр. 9): базовый сценарий
      — 12 полных проверок в год.'
- key: cleaning_area_m2
  group: operations
  name: Площадь уборки
  type: number
  unit: м²
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Площадь пола, которую моют или подметают (проезды и проходы, без площади под стеллажами). Если поле пустое, берётся
    общая площадь склада.
  example: '12000'
  affects: [floor_cleaning]
  order: 25
  default: null
- key: staff_total
  group: staff
  name: Всего сотрудников на складе
  type: integer
  unit: чел.
  required: true
  dataset_row: Общая численность персонала склада
  step: null
  enum_values: null
  hint: Все сотрудники склада, включая ИТР, кладовщиков, водителей погрузчиков и уборку.
  example: '180'
  affects: [pallet_transport, order_picking, high_bay_storage, parcel_sorting, inventory_count, floor_cleaning]
  order: 26
  default: null
- key: pickers
  group: staff
  name: Отборщики (комплектовщики)
  type: integer
  unit: чел.
  required: true
  dataset_row: 'Из них: отборщики (комплектовщики)'
  step: null
  enum_values: null
  hint: Сколько человек собирают заказы, во всех сменах вместе. Главная группа для экономии при роботизации.
  example: '100'
  affects: [order_picking]
  order: 27
  default: null
- key: forklift_operators
  group: staff
  name: Операторы погрузчиков
  type: integer
  unit: чел.
  required: true
  dataset_row: 'Из них: операторы погрузчиков'
  step: null
  enum_values: null
  hint: Сколько водителей погрузчиков и штабелёров во всех сменах вместе.
  example: '25'
  affects: [pallet_transport, high_bay_storage]
  order: 28
  default: null
- key: packers
  group: staff
  name: Операторы упаковочных линий
  type: integer
  unit: чел.
  required: false
  dataset_row: 'Из них: операторы упаковочных линий'
  step: null
  enum_values: null
  hint: Сколько человек упаковывают и сортируют заказы во всех сменах вместе.
  example: '20'
  affects: [parcel_sorting]
  order: 29
  default: null
- key: inventory_staff
  group: staff
  name: Сотрудники на инвентаризации
  type: integer
  unit: чел.
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Сколько сотрудников (в пересчёте на полную ставку) заняты пересчётом остатков.
  example: '2'
  affects: [inventory_count]
  order: 30
  default:
    value: 2
    status: assumption
    rationale: 'В датасете нет. Методика ФЦ БАС «Инвентаризация складов» (PDF стр. 9): традиционный метод — 2 человека, 160
      ч на одну полную инвентаризацию; при 12 проверках в год это 3 840 ч, то есть около 2 полных ставок.'
- key: cleaners
  group: staff
  name: Уборщики склада
  type: integer
  unit: чел.
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Сколько уборщиков или операторов поломоечных машин во всех сменах вместе. Если не знаете — оставьте пустым, платформа
    оценит по площади уборки.
  example: '4'
  affects: [floor_cleaning]
  order: 31
  default: null
- key: picker_salary_rub_month
  group: staff
  name: Зарплата отборщика
  type: number
  unit: руб./мес.
  required: true
  dataset_row: Средняя з/п отборщика (gross)
  step: null
  enum_values: null
  hint: Средняя начисленная зарплата до вычета НДФЛ (gross) за месяц, без страховых взносов.
  example: '100000'
  affects: [order_picking]
  order: 32
  default: null
- key: forklift_salary_rub_month
  group: staff
  name: Зарплата оператора погрузчика
  type: number
  unit: руб./мес.
  required: true
  dataset_row: Средняя з/п оператора погрузчика (gross)
  step: null
  enum_values: null
  hint: Средняя начисленная зарплата до вычета НДФЛ (gross) за месяц, без страховых взносов.
  example: '120000'
  affects: [pallet_transport, high_bay_storage]
  order: 33
  default: null
- key: packer_salary_rub_month
  group: staff
  name: Зарплата оператора упаковки
  type: number
  unit: руб./мес.
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Средняя начисленная зарплата до вычета НДФЛ (gross) за месяц, без страховых взносов.
  example: '100000'
  affects: [parcel_sorting]
  order: 34
  default:
    value: 100000
    status: assumption
    rationale: 'В датасете нет зарплаты упаковщиков. Берём зарплату отборщика из того же листа (100 000 руб./мес.): это складские
      рабочие сопоставимой квалификации. Уточнить у заказчика.'
- key: inventory_staff_salary_rub_month
  group: staff
  name: Зарплата сотрудника на инвентаризации
  type: number
  unit: руб./мес.
  required: false
  dataset_row: null
  step: null
  enum_values: null
  hint: Средняя начисленная зарплата кладовщика или учётчика (gross) за месяц.
  example: '100000'
  affects: [inventory_count]
  order: 35
  default:
    value: 100000
    status: assumption
