labor_groups:
- {key: pickers, name: Отборщики (комплектовщики), headcount_param: pickers, salary_param: picker_salary_rub_month}
- {key: forklift_operators, name: Операторы погрузчиков, headcount_param: forklift_operators, salary_param: forklift_salary_rub_month}
- {key: packers, name: Операторы упаковочных линий, headcount_param: packers, salary_param: packer_salary_rub_month}
- {key: inventory_staff, name: Сотрудники на инвентаризации, headcount_param: inventory_staff, salary_param: inventory_staff_salary_rub_month}
- {key: cleaners, name: Уборщики, headcount_param: cleaners, salary_param: cleaner_salary_rub_month}
processes:
- key: pallet_transport
  name: Перемещение паллет (приёмка → хранение → отгрузка)
  description: Перевозка паллет от ворот приёмки в зону хранения, из хранения к воротам отгрузки и внутри склада. Норматив
    — «Норматив обработки паллеты» (pallet_lead_time_min) для доли «Целевая доля операций в срок» (sla_target_share).
  demand_unit: pallet
  demand_formula: приёмка + отгрузка + внутрискладские перемещения, палл/сут; в пик × пиковый коэффициент
  demand_params: [pallets_internal_per_day, pallets_in_per_day, pallets_out_per_day, shifts_per_day, shift_hours, peak_factor]
  demand: {per_day: pallets_in_per_day + pallets_out_per_day + pallets_internal_per_day, hours_per_day: shifts_per_day * shift_hours,
    peak_factor: peak_factor}
  sla: {kind: lead_time, target_value: 20, unit: мин}
  labor_groups: [forklift_operators]
  labor_allocation: {forklift_operators: 0.7}
  labor_allocation_note: 'Датасет не делит операторов погрузчиков по операциям. Допущение команды: при фронтальных стеллажах
    каждый цикл погрузчика — это перевозка паллеты между воротами и стеллажом и подъём на ярус. Подъём занимает около минуты
    (норматив fork_lift_cycle_extra_s = 60 с) из цикла в 3–4 минуты, поэтому 30 % времени операторов относим к высотному хранению,
    70 % — к перемещению паллет.'
  solution_types: [amr_transport, fmr_forklift, tow_tractor]
  sizing_model: transport_cycle
  route_length: coalesce(pallet_route_length_m, transport_default_one_way_distance_m)
  unit_weight: pallet_weight_kg
  requirements:
  - key: payload_vs_pallet
    spec: payload_kg
    comparison: gte
    required: pallet_weight_kg
    unit: кг
    solution_types: [amr_transport, fmr_forklift]
    message: Грузоподъёмность меньше массы паллеты
    why_needed: Нужна грузоподъёмность, чтобы проверить, поднимет ли робот паллету массой {required} кг
  - key: towing_vs_pallet
    spec: towing_capacity_kg
    comparison: gte
    required: pallet_weight_kg
    unit: кг
    solution_types: [tow_tractor]
    message: Тягач не буксирует даже одну паллету
    why_needed: Нужна буксируемая масса, чтобы проверить, увезёт ли тягач хотя бы одну паллету массой {required} кг
  - key: width_in_main_aisle
    spec: width_mm
    comparison: lte
    required: m_to_mm(main_aisle_width_m) - aisle_safety_clearance_mm
    unit: мм
    solution_types: [amr_transport, tow_tractor]
    message: Робот шире, чем позволяет главный проезд с зазором безопасности
    why_needed: 'Нужна ширина робота, чтобы проверить, пройдёт ли он по главному проезду с зазором безопасности: не шире {required}
      мм'
  - key: min_aisle_main_aisle
    spec: min_aisle_width_mm
    comparison: lte
    required: m_to_mm(main_aisle_width_m)
    unit: мм
    solution_types: [amr_transport, tow_tractor]
    message: Роботу нужен проезд шире, чем главный проезд на объекте
    why_needed: 'Нужна минимальная ширина проезда робота, чтобы сравнить её с шириной на объекте: {required} мм'
  - key: width_in_working_aisle
    spec: width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m) - aisle_safety_clearance_mm
    unit: мм
    solution_types: [fmr_forklift]
    message: Робот шире, чем позволяет рабочий проход с зазором безопасности
    why_needed: 'Нужна ширина робота, чтобы проверить, пройдёт ли он по рабочему проходу с зазором безопасности: не шире {required}
      мм'
  - key: min_aisle_working_aisle
    spec: min_aisle_width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m)
    unit: мм
    solution_types: [fmr_forklift]
    message: Роботу нужен проезд шире, чем рабочий проход на объекте
    why_needed: 'Нужна минимальная ширина проезда робота, чтобы сравнить её с шириной на объекте: {required} мм'
  - key: temperature_min
    spec: operating_temp_min_c
    comparison: lte
    required: min_temperature_c
    unit: °C
    solution_types: []
    message: Робот не рассчитан на такую низкую температуру в зоне работы
    why_needed: 'Нужна минимальная рабочая температура робота: на объекте бывает до {required} °C'
- key: order_picking
  name: Отбор заказов
  description: 'Сборка заказов по строкам: вместо того чтобы отборщик ходил по складу, роботы подвозят товар к станции или
    подсказывают, что брать. Цель — доля строк в срок «Целевая доля операций в срок» (sla_target_share).'
  demand_unit: line
  demand_formula: строк отбора в сутки; в пик × пиковый коэффициент
  demand_params: [order_lines_per_day, shifts_per_day, shift_hours, peak_factor]
  demand: {per_day: order_lines_per_day, hours_per_day: shifts_per_day * shift_hours, peak_factor: peak_factor}
  sla: {kind: on_time_share, target_value: 0.95, unit: доля}
  labor_groups: [pickers]
  labor_allocation: {pickers: 1.0}
  labor_allocation_note: 'Отборщики заняты только отбором (строка датасета «Из них: отборщики»), вся группа относится к этому
    процессу. Какая часть высвобождается, задаёт норматив labor_release_share_picking.'
  solution_types: [goods_to_person, pick_assist, piece_picking_arm, amr_transport]
  sizing_model: goods_to_person
  route_length: transport_default_one_way_distance_m
  unit_weight: item_weight_kg * pieces_per_day / order_lines_per_day
  requirements:
  - key: payload_vs_item
    spec: payload_kg
    comparison: gte
    required: item_weight_kg
    unit: кг
    solution_types: [piece_picking_arm]
    message: Манипулятор не поднимет среднюю единицу товара
    why_needed: Нужна грузоподъёмность манипулятора, чтобы проверить, возьмёт ли он товар массой {required} кг
  - key: storage_height_vs_ceiling
    spec: max_storage_height_m
    comparison: lte
    required: ceiling_height_m
    unit: м
    solution_types: [goods_to_person]
    message: Система хранения выше потолков склада
    why_needed: Нужна высота системы хранения, чтобы проверить, поместится ли она под потолком высотой {required} м
  - key: width_in_working_aisle
    spec: width_mm
    comparison: lte
