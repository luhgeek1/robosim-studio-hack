- key: high_bay_storage
  name: Высотное хранение и размещение паллет
  description: Размещение паллет в ячейки и выдача из ячеек автоматической системой хранения или беспилотным штабелёром. Цель
    — доля операций в срок «Целевая доля операций в срок» (sla_target_share).
  demand_unit: pallet
  demand_formula: размещение (= приёмка) + выдача (= отгрузка), палл/сут; ёмкость — паллетомест
  demand_params: [pallets_in_per_day, pallets_out_per_day, shifts_per_day, shift_hours, peak_factor]
  demand: {per_day: pallets_in_per_day + pallets_out_per_day, hours_per_day: shifts_per_day * shift_hours, peak_factor: peak_factor}
  sla: {kind: on_time_share, target_value: 0.95, unit: доля}
  labor_groups: [forklift_operators]
  labor_allocation: {forklift_operators: 0.3}
  labor_allocation_note: 'Датасет не делит операторов погрузчиков по операциям. Допущение команды: при фронтальных стеллажах
    каждый цикл погрузчика — это перевозка паллеты между воротами и стеллажом и подъём на ярус. Подъём занимает около минуты
    (норматив fork_lift_cycle_extra_s = 60 с) из цикла в 3–4 минуты, поэтому 30 % времени операторов относим к высотному хранению,
    70 % — к перемещению паллет.'
  solution_types: [asrs_storage, fmr_forklift]
  sizing_model: station_throughput
  unit_weight: pallet_weight_kg
  requirements:
  - key: payload_vs_pallet
    spec: payload_kg
    comparison: gte
    required: pallet_weight_kg
    unit: кг
    solution_types: []
    message: Грузоподъёмность меньше массы паллеты
    why_needed: Нужна грузоподъёмность, чтобы проверить, поднимет ли робот паллету массой {required} кг
  - key: storage_height_vs_ceiling
    spec: max_storage_height_m
    comparison: lte
    required: ceiling_height_m
    unit: м
    solution_types: [asrs_storage]
    message: Система хранения выше потолков склада
    why_needed: Нужна высота системы хранения, чтобы проверить, поместится ли она под потолком высотой {required} м
  - key: width_in_working_aisle
    spec: width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m) - aisle_safety_clearance_mm
    unit: мм
    solution_types: [fmr_forklift]
    message: Робот шире, чем позволяет рабочий проход с зазором безопасности
    why_needed: 'Нужна ширина робота, чтобы проверить, пройдёт ли он по рабочему проходу с зазором безопасности: не шире {required}
      мм'
  - key: min_aisle_working_aisle
    spec: min_aisle_width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m)
    unit: мм
    solution_types: [fmr_forklift]
    message: Роботу нужен проезд шире, чем рабочий проход на объекте
    why_needed: 'Нужна минимальная ширина проезда робота, чтобы сравнить её с шириной на объекте: {required} мм'
  - key: temperature_min
    spec: operating_temp_min_c
    comparison: lte
    required: min_temperature_c
    unit: °C
    solution_types: []
    message: Робот не рассчитан на такую низкую температуру в зоне работы
    why_needed: 'Нужна минимальная рабочая температура робота: на объекте бывает до {required} °C'
- key: parcel_sorting
  name: Сортировка коробов и посылок по направлениям
  description: Разбор отгружаемых коробов по направлениям и укладка на паллеты. Поток коробов оценивается из отгрузки паллет
    и числа коробов на паллете. Цель — «Целевая доля операций в срок» (sla_target_share).
  demand_unit: item
  demand_formula: отгрузка паллет в сутки × коробов на паллете, коробов/сут
  demand_params: [pallets_out_per_day, boxes_per_pallet, shifts_per_day, shift_hours, peak_factor]
  demand: {per_day: pallets_out_per_day * boxes_per_pallet, hours_per_day: shifts_per_day * shift_hours, peak_factor: peak_factor}
  sla: {kind: on_time_share, target_value: 0.95, unit: доля}
  labor_groups: [packers]
  labor_allocation: {packers: 1.0}
  labor_allocation_note: Операторы упаковочных линий — единственная группа, которая сейчас разбирает и упаковывает отгрузку;
    вся группа относится к сортировке. Датасет отмечает, что функция автоматизируется частично — это учитывает доля высвобождения,
    а не распределение.
  solution_types: [sorting_robot, palletizing_arm]
  sizing_model: station_throughput
  unit_weight: pallet_weight_kg / boxes_per_pallet
  requirements:
  - key: payload_vs_box
    spec: payload_kg
    comparison: gte
    required: pallet_weight_kg / boxes_per_pallet
    unit: кг
    solution_types: []
    message: Робот не поднимет средний короб
    why_needed: Нужна грузоподъёмность, чтобы проверить, возьмёт ли робот средний короб массой {required} кг (масса паллеты
      ÷ коробов на паллете)
  - key: temperature_min
    spec: operating_temp_min_c
    comparison: lte
    required: min_temperature_c
    unit: °C
    solution_types: []
    message: Робот не рассчитан на такую низкую температуру в зоне работы
    why_needed: 'Нужна минимальная рабочая температура робота: на объекте бывает до {required} °C'
- key: inventory_count
  name: Инвентаризация остатков
  description: Пересчёт остатков в ячейках роботом-сканером вместо людей с терминалами и подъёмной техникой. Цель — выполнить
    «Полных инвентаризаций в год» (inventory_counts_per_year).
  demand_unit: m2
  demand_formula: площадь склада × полных инвентаризаций в год ÷ рабочих дней в году, м²/сут
  demand_params: [working_days_per_year, area_m2, inventory_counts_per_year, shifts_per_day, shift_hours, scheduled_peak_factor]
  demand: {per_day: area_m2 * inventory_counts_per_year / working_days_per_year, hours_per_day: shifts_per_day * shift_hours,
    peak_factor: scheduled_peak_factor}
  sla: {kind: coverage, target_value: 12, unit: раз/год}
  labor_groups: [inventory_staff]
  labor_allocation: {inventory_staff: 1.0}
  labor_allocation_note: 'Сотрудники на инвентаризации (оценка по методике ФЦ БАС: 2 полные ставки) заняты только пересчётом
    остатков.'
  solution_types: [inventory_robot]
  sizing_model: area_coverage
  requirements:
  - key: width_in_working_aisle
    spec: width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m) - aisle_safety_clearance_mm
    unit: мм
    solution_types: []
    message: Робот шире, чем позволяет рабочий проход с зазором безопасности
    why_needed: 'Нужна ширина робота, чтобы проверить, пройдёт ли он по рабочему проходу с зазором безопасности: не шире {required}
      мм'
  - key: min_aisle_working_aisle
    spec: min_aisle_width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m)
    unit: мм
    solution_types: []
    message: Роботу нужен проезд шире, чем рабочий проход на объекте
    why_needed: 'Нужна минимальная ширина проезда робота, чтобы сравнить её с шириной на объекте: {required} мм'
  - key: temperature_min
    spec: operating_temp_min_c
    comparison: lte
    required: min_temperature_c
    unit: °C
    solution_types: []
    message: Робот не рассчитан на такую низкую температуру в зоне работы
    why_needed: 'Нужна минимальная рабочая температура робота: на объекте бывает до {required} °C'
- key: floor_cleaning
  name: Уборка пола
  description: Влажная уборка или подметание проездов и проходов автономной поломоечной машиной. Цель — норматив «Кратность
    уборки в сутки» (cleaning_passes_per_day из реестра нормативов) по всей площади уборки.
  demand_unit: m2
  demand_formula: площадь уборки (если не задана — общая площадь склада) × кратность уборки в сутки, м²/сут
  demand_params: [cleaning_area_m2, area_m2, shifts_per_day, shift_hours, scheduled_peak_factor]
  demand: {per_day: 'coalesce(cleaning_area_m2, area_m2) * cleaning_passes_per_day', hours_per_day: shifts_per_day * shift_hours,
    peak_factor: scheduled_peak_factor}
  sla: {kind: coverage, target_value: 2, unit: раз/сут}
  labor_groups: [cleaners]
  labor_allocation: {cleaners: 1.0}
  labor_allocation_note: Уборщики склада заняты только уборкой.
  solution_types: [cleaning_robot]
  sizing_model: area_coverage
  requirements:
  - key: width_in_working_aisle
    spec: width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m) - aisle_safety_clearance_mm
    unit: мм
    solution_types: []
    message: Робот шире, чем позволяет рабочий проход с зазором безопасности
    why_needed: 'Нужна ширина робота, чтобы проверить, пройдёт ли он по рабочему проходу с зазором безопасности: не шире {required}
      мм'
  - key: min_aisle_working_aisle
    spec: min_aisle_width_mm
    comparison: lte
    required: m_to_mm(aisle_width_m)
    unit: мм
    solution_types: []
    message: Роботу нужен проезд шире, чем рабочий проход на объекте
    why_needed: 'Нужна минимальная ширина проезда робота, чтобы сравнить её с шириной на объекте: {required} мм'
  - key: temperature_min
    spec: operating_temp_min_c
    comparison: lte
    required: min_temperature_c
    unit: °C
    solution_types: []
    message: Робот не рассчитан на такую низкую температуру в зоне работы
    why_needed: 'Нужна минимальная рабочая температура робота: на объекте бывает до {required} °C'
checks:
- key: robotized_area_within_total
  expression: robotized_area_m2 <= area_m2
  severity: error
  params: [robotized_area_m2, area_m2]
  message: Зона для роботов больше общей площади склада
  how_to_fix: 'Проверьте площади: зона роботизации — часть склада'
- key: cleaning_area_within_total
  expression: cleaning_area_m2 <= area_m2
  severity: error
  params: [cleaning_area_m2, area_m2]
  message: Площадь уборки больше общей площади склада
  how_to_fix: Укажите площадь проездов и проходов, которые реально убираются
- key: staff_groups_within_total
  expression: pickers + forklift_operators + packers <= staff_total
  severity: error
  params: [staff_total, packers, pickers, forklift_operators]
  message: Отборщиков, операторов погрузчиков и упаковщиков вместе больше, чем всего сотрудников склада
  how_to_fix: 'Проверьте численность: группы входят в общую численность персонала'
- key: staff_groups_with_support_within_total
  expression: pickers + forklift_operators + packers + inventory_staff + cleaners <= staff_total
  severity: warning
  params: [staff_total, cleaners, inventory_staff, packers, pickers, forklift_operators]
  message: Сумма всех групп персонала больше общей численности склада
  how_to_fix: Проверьте численность уборщиков и сотрудников на инвентаризации
- key: pieces_not_less_than_lines
  expression: pieces_per_day >= order_lines_per_day
  severity: error
  params: [pieces_per_day, order_lines_per_day]
  message: 'Штук отбора меньше, чем строк: в каждой строке заказа хотя бы одна штука'
  how_to_fix: Проверьте объёмы отбора в строках и в штуках
- key: pickers_cover_current_volume
  expression: pickers * picker_productivity_lines_per_hour * shift_hours - pickers * picker_productivity_lines_per_hour *
    shift_hours * time_loss_pct >= order_lines_per_day
  severity: warning
  params: [order_lines_per_day, shift_hours, time_loss_pct, pickers, picker_productivity_lines_per_hour]
  message: Текущий штат отборщиков при указанной выработке не собирает суточный объём строк
  how_to_fix: Проверьте выработку отборщика, число отборщиков и потери рабочего времени — одно из чисел, вероятно, неточно
- key: storage_holds_daily_receipts
  expression: pallet_positions >= pallets_in_per_day
  severity: warning
  params: [pallet_positions, pallets_in_per_day]
  message: Паллетомест меньше, чем паллет принимается за сутки
  how_to_fix: Проверьте ёмкость склада и объём приёмки
- key: working_aisle_not_wider_than_main
  expression: aisle_width_m <= main_aisle_width_m
  severity: info
  params: [aisle_width_m, main_aisle_width_m]
  message: Рабочие проходы шире главных проездов — так бывает редко
  how_to_fix: 'Проверьте ширину: для подбора роботов важна самая узкая точка маршрута'
- key: item_lighter_than_pallet
  expression: item_weight_kg <= pallet_weight_kg
  severity: error
  params: [item_weight_kg, pallet_weight_kg]
  message: Штучный товар тяжелее паллеты
  how_to_fix: Проверьте массу паллеты и штучной единицы
demo_projects:
- {key: warehouse_demo_01, name: 'Склад 20 000 м², 180 сотрудников (данные организатора)', description: 'Демо-объект с листа
    «Склад» датасета организатора: 1 000 паллет приёмки и 1 000 отгрузки, 100 000 строк отбора в сутки, 2 смены по 11 ч, фронтальные
    стеллажи на 20 000 паллетомест.'}
