  name: Зарплата сотрудника наземного обслуживания
  type: number
  unit: руб./мес.
  required: true
  dataset_row: Средняя з/п сотрудника наземного обслуживания (gross)
  step: null
  enum_values: null
  hint: Средняя начисленная зарплата до вычета НДФЛ (gross) за месяц, без страховых взносов.
