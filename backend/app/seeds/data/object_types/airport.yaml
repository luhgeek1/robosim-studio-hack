  order: 50
  default:
    value: 0.95
    status: assumption
    rationale: 'В датасете и ТЗ нет. То же допущение команды, что и для склада: 95 % операций в срок — рабочая цель уровня
      сервиса, при которой редкие пиковые задержки допустимы. Пользователь меняет значение.'
labor_groups:
- {key: ground_staff, name: Персонал наземного обслуживания, headcount_param: ground_staff, salary_param: ground_staff_salary_rub_month}
- {key: terminal_staff, name: Персонал терминала (логистика и уборка), headcount_param: terminal_staff, salary_param: cleaner_salary_rub_month}
processes:
- key: baggage_handling
  name: Перевозка багажа между терминалом и самолётом
  description: 'Доставка багажа от зала сортировки к стоянке самолёта и обратно беспилотными тягачами с тележками или багажными
    AMR. Норматив — «Время оборота самолёта» (turnaround_min): багаж должен успеть за стоянку.'
  demand_unit: bag
  demand_formula: мест багажа в сутки; пик — рейсов в пиковый час ÷ среднечасовых рейсов
  demand_params: [baggage_per_day, operating_hours_per_day, flights_per_day, flights_peak_hour]
  demand: {per_day: baggage_per_day, hours_per_day: operating_hours_per_day, peak_factor: flights_peak_hour * operating_hours_per_day
      / flights_per_day, load_per_trip: tow_train_carts_per_trip * bags_per_cart, trip_tare_kg: tow_train_carts_per_trip * baggage_cart_tare_kg}
  sla: {kind: lead_time, target_value: 45, unit: мин}
  labor_groups: [ground_staff]
  labor_allocation: {ground_staff: 0.2}
  labor_release: labor_release_share_transport * tow_driving_share
  labor_allocation_note: 'Датасет не делит персонал перрона по операциям, но в примечании к строке «Среднее количество операций
    наземного обслуживания на 1 рейс» перечисляет пять видов работ: буксировка, питание, заправка, уборка, разгрузка и погрузка.
    Допущение команды: виды работ равны по трудоёмкости, на багаж (разгрузка и погрузка) приходится 1 из 5, то есть 20 % персонала
    перрона.'
  solution_types: [tow_tractor, amr_transport, autonomous_truck, sorting_robot]
  sizing_model: tow_train
  route_length: baggage_route_length_m
  unit_weight: baggage_weight_kg
  requirements:
  - key: towing_vs_baggage_train
    spec: towing_capacity_kg
    comparison: gte
    required: tow_train_carts_per_trip * (bags_per_cart * baggage_weight_kg + baggage_cart_tare_kg)
    unit: кг
    solution_types: [tow_tractor]
    message: Тягач не буксирует сцепку груженых багажных тележек
    why_needed: Нужна буксируемая масса, чтобы проверить, увезёт ли тягач сцепку тележек с багажом массой {required} кг
  - key: payload_vs_baggage_cart
    spec: payload_kg
    comparison: gte
    required: bags_per_cart * baggage_weight_kg + baggage_cart_tare_kg
    unit: кг
    solution_types: [amr_transport, autonomous_truck]
    message: Грузоподъёмность меньше массы груженой багажной тележки
    why_needed: Нужна грузоподъёмность, чтобы проверить, увезёт ли робот груженую багажную тележку массой {required} кг
  - key: payload_vs_bag
    spec: payload_kg
    comparison: gte
    required: baggage_weight_kg
    unit: кг
    solution_types: [sorting_robot]
    message: Робот-сортировщик не поднимет среднее место багажа
    why_needed: Нужна грузоподъёмность, чтобы проверить, возьмёт ли робот место багажа массой {required} кг
  - key: temperature_apron
    spec: operating_temp_min_c
    comparison: lte
    required: apron_min_temperature_c
    unit: °C
    solution_types: [tow_tractor, amr_transport, autonomous_truck]
    message: Робот не рассчитан на зимнюю температуру перрона
    why_needed: 'Нужна минимальная рабочая температура: на перроне зимой бывает до {required} °C'
- key: cart_and_waste_logistics
  name: Грузовые тележки и вывоз мусора в терминале
  description: Перевозка грузов, расходных материалов и мусорных контейнеров внутри терминала. Цель — «Целевая доля операций
    в срок» (sla_target_share).
  demand_unit: trip
  demand_formula: рейсов грузовых тележек + контейнеров мусора в сутки; пик — по пассажиропотоку
  demand_params: [internal_cart_trips_per_day, waste_containers_per_day, operating_hours_per_day, pax_per_day, pax_peak_hour]
  demand: {per_day: internal_cart_trips_per_day + waste_containers_per_day, hours_per_day: operating_hours_per_day, peak_factor: pax_peak_hour
      * operating_hours_per_day / pax_per_day}
  sla: {kind: on_time_share, target_value: 0.95, unit: доля}
  labor_groups: [terminal_staff]
  labor_allocation: {terminal_staff: 0.12}
  labor_release: labor_release_share_transport
  labor_allocation_note: 'Датасет не делит персонал терминала по функциям («уборщики, курьеры, грузчики»), поэтому долю считаем
    по объёму работ из того же листа: (420 рейсов тележек + 85 контейнеров мусора) в сутки × ~15 мин на рейс (200 м туда
    и обратно с тележкой + погрузка и выгрузка) ≈ 126 ч работы в сутки ≈ 5,3 поста 24/7 × 4,2 FTE на пост (норматив fte_per_24x7_post)
    ≈ 22 человека из 180, то есть 0,12.'
  solution_types: [amr_transport, tow_tractor, delivery_robot]
  sizing_model: transport_cycle
  route_length: terminal_route_length_m
  requirements:
  - key: noise_limit
    spec: noise_dba
    comparison: lte
    required: noise_limit_dba
    unit: дБА
    solution_types: []
    message: Робот шумнее, чем допускается в зоне работы
    why_needed: 'Нужен уровень шума робота: в зоне допускается не больше {required} дБА, особенно ночью'
- key: terminal_cleaning
  name: Уборка терминала
  description: Влажная уборка залов терминала автономными поломоечными машинами. Цель — норматив «Кратность уборки в сутки»
    (cleaning_passes_per_day из реестра нормативов) по всей площади роботизированной уборки.
  demand_unit: m2
  demand_formula: площадь для роботизированной уборки × кратность уборки в сутки, м²/сут
  demand_params: [cleaning_area_m2, operating_hours_per_day, scheduled_peak_factor]
  demand: {per_day: cleaning_area_m2 * cleaning_passes_per_day, hours_per_day: operating_hours_per_day, peak_factor: scheduled_peak_factor, manual_rate: machine_cleaning_m2_per_hour}
  sla: {kind: coverage, target_value: 2, unit: раз/сут}
  labor_groups: [terminal_staff]
  labor_allocation: {terminal_staff: 0.1}
  labor_release: labor_release_share_cleaning
  labor_allocation_note: 'В терминале работают 8 поломоечных машин (датасет), поэтому база — машинная уборка, а не ручная:
    51 000 м² × 2 уборки в сутки (норматив cleaning_passes_per_day) / 1000 м²/ч (верх норматива manual_cleaning_m2_per_hour —
    машина с оператором, ФЦ БАС) ≈ 102 ч в сутки ≈ 4,3 поста 24/7 × 4,2 FTE (норматив fte_per_24x7_post) ≈ 18 операторов из 180,
    то есть 0,1. Остальной персонал терминала (санузлы, урны, помощь пассажирам) в роботизируемые процессы не входит.'
  solution_types: [cleaning_robot]
  sizing_model: area_coverage
  requirements:
  - key: noise_limit
    spec: noise_dba
    comparison: lte
    required: noise_limit_dba
    unit: дБА
    solution_types: []
    message: Робот шумнее, чем допускается в зоне работы
    why_needed: 'Нужен уровень шума робота: в зоне допускается не больше {required} дБА, особенно ночью'
- key: passenger_assistance
  name: Помощь и навигация пассажиров
  description: 'Роботы-консультанты и сопровождающие у стоек регистрации и выходов: подсказывают дорогу, провожают трансферных
    пассажиров. Эффект — сервис, а не замещение персонала, поэтому группы персонала не заданы.'
  demand_unit: trip
  demand_formula: пассажиров в сутки × доля трансферных, сопровождений/сут; пик — по пассажиропотоку
  demand_params: [pax_per_day, transfer_pax_pct, operating_hours_per_day, pax_peak_hour]
  demand: {per_day: pax_per_day * transfer_pax_pct, hours_per_day: operating_hours_per_day, peak_factor: pax_peak_hour * operating_hours_per_day
      / pax_per_day}
  sla: {kind: on_time_share, target_value: 0.95, unit: доля}
  labor_groups: []
  labor_allocation: {}
  labor_allocation_note: Сопровождение пассажиров сейчас не выполняет ни одна группа персонала из датасета; эффект процесса
    — сервис, ФОТ не распределяется.
  solution_types: [service_robot, delivery_robot]
  sizing_model: station_throughput
  requirements:
  - key: noise_limit
    spec: noise_dba
    comparison: lte
    required: noise_limit_dba
    unit: дБА
    solution_types: []
    message: Робот шумнее, чем допускается в зоне работы
    why_needed: 'Нужен уровень шума робота: в зоне допускается не больше {required} дБА, особенно ночью'
- key: security_patrol
  name: Патрулирование терминала
  description: Регулярный объезд залов терминала роботом с камерами. Сотрудников службы безопасности в датасете нет, поэтому
    эффект по персоналу не считается. Число обходов — параметр «Обходов терминала в сутки» (patrol_rounds_per_day), в датасете
    его нет.
  demand_unit: m2
  demand_formula: площадь терминалов × обходов в сутки, м²/сут
  demand_params: [terminal_area_m2, patrol_rounds_per_day, operating_hours_per_day, scheduled_peak_factor]
  demand: {per_day: terminal_area_m2 * patrol_rounds_per_day, hours_per_day: operating_hours_per_day, peak_factor: scheduled_peak_factor}
  labor_groups: []
  labor_allocation: {}
  labor_allocation_note: Сотрудников службы безопасности в датасете нет, ФОТ не распределяется.
  solution_types: [service_robot]
  sizing_model: area_coverage
  requirements:
  - key: noise_limit
    spec: noise_dba
    comparison: lte
    required: noise_limit_dba
    unit: дБА
    solution_types: []
    message: Робот шумнее, чем допускается в зоне работы
    why_needed: 'Нужен уровень шума робота: в зоне допускается не больше {required} дБА, особенно ночью'
checks:
- key: cleaning_area_within_terminal
  expression: cleaning_area_m2 <= terminal_area_m2
  severity: error
  params: [cleaning_area_m2, terminal_area_m2]
  message: Площадь роботизированной уборки больше площади терминалов
  how_to_fix: 'Уборка роботами возможна только внутри терминалов: проверьте обе площади'
- key: pax_peak_below_daily
  expression: pax_peak_hour <= pax_per_day
  severity: error
  params: [pax_peak_hour, pax_per_day]
  message: Пассажиров в пиковый час больше, чем за сутки
  how_to_fix: Проверьте пиковый и суточный пассажиропоток
- key: pax_peak_not_below_average
  expression: pax_peak_hour * operating_hours_per_day >= pax_per_day
  severity: error
  params: [pax_per_day, pax_peak_hour, operating_hours_per_day]
  message: Пиковый час меньше среднего часа по пассажирам
  how_to_fix: 'Пиковый поток не может быть меньше среднего: проверьте пиковый час и часы работы'
- key: flights_peak_below_daily
  expression: flights_peak_hour <= flights_per_day
  severity: error
  params: [flights_peak_hour, flights_per_day]
  message: Рейсов в пиковый час больше, чем за сутки
  how_to_fix: Проверьте число рейсов
- key: flights_peak_not_below_average
  expression: flights_peak_hour * operating_hours_per_day >= flights_per_day
  severity: error
  params: [flights_per_day, flights_peak_hour, operating_hours_per_day]
  message: Пиковый час меньше среднего часа по рейсам
  how_to_fix: 'Пиковое число рейсов не может быть меньше среднего: проверьте пиковый час и часы работы'
- key: baggage_per_passenger
  expression: baggage_per_day <= pax_per_day
  severity: warning
  params: [baggage_per_day, pax_per_day]
  message: 'Мест багажа в сутки больше, чем пассажиров: больше одного места на каждого пассажира'
  how_to_fix: 'Проверьте объём багажа по системе обработки багажа: обычно багаж сдаёт не каждый пассажир'
- key: refuelling_below_flights
  expression: refuelling_flights_per_day < flights_per_day
  severity: info
  params: [refuelling_flights_per_day, flights_per_day]
  message: Заправок столько же или больше, чем взлётов и посадок, — вероятно, посадки посчитаны как заправки
  how_to_fix: 'Заправляют вылетающие рейсы: укажите число заправок, а не всех движений'
- key: cleaning_machines_within_staff
  expression: cleaning_machines <= terminal_staff
  severity: error
  params: [cleaning_machines, terminal_staff]
  message: Уборочных машин больше, чем сотрудников терминала
  how_to_fix: Проверьте число машин и персонала терминала
