<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>$title</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f5f2ec;color:#242c2b;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%">
    <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all">$preview</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f2ec">
      <tr>
        <td align="center" style="padding:32px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:580px">
            <tr>
              <td style="padding:0 20px 24px">
                <a href="$web_url" style="font-size:23px;line-height:1.2;font-weight:700;letter-spacing:-0.5px;color:#242c2b;text-decoration:none">РобоМера<span style="color:#ff6b42">.</span></a>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 24px;background-color:#fffefb;border:1px solid #e6dfd8;border-radius:14px">
                <h1 style="margin:0 0 24px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-0.6px;color:#242c2b">$title</h1>
                $paragraphs
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0">
                  <tr>
                    <td bgcolor="#ff6b42" style="border-radius:10px;background-color:#ff6b42">
                      <a href="$action_url" style="display:inline-block;padding:16px 24px;border:1px solid #ff6b42;border-radius:10px;color:#24251e;text-decoration:none;font-size:15px;line-height:1.4;font-weight:700;mso-padding-alt:0">
                        $action_label
                      </a>
                    </td>
                  </tr>
                </table>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;background-color:#f5f2ec;border-radius:10px">
                  $facts
                </table>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#66625c">$footnote</p>
                <p style="margin:24px 0 8px;padding-top:24px;border-top:1px solid #e6dfd8;font-size:12px;line-height:1.6;color:#66625c">Если кнопка не открывается, скопируйте ссылку в браузер:</p>
                <p style="margin:0;font-size:12px;line-height:1.6;word-break:break-all;overflow-wrap:anywhere">
                  <a href="$action_url" style="color:#a5371c;text-decoration:underline;word-break:break-all">$action_url</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 20px 0;font-size:12px;line-height:1.7;color:#66625c">
                <p style="margin:0 0 8px">РобоМера - платформа оценки роботизации.<br />Данные объекта, подбор, имитация и экономика в одном месте.</p>
                <a href="$web_url/privacy/" style="color:#66625c;text-decoration:underline">Политика конфиденциальности</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
