components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен из /auth/login или /auth/refresh
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Ключ интеграции из /me/api-keys (только эндпоинты /integrations/*)
  schemas:
    Problem: {$ref: './components/common.yaml#/Problem'}
    ErrorCode: {$ref: './components/common.yaml#/ErrorCode'}
    PValue: {$ref: './components/common.yaml#/PValue'}
    Provenance: {$ref: './components/common.yaml#/Provenance'}
    ProvenanceStatus: {$ref: './components/common.yaml#/ProvenanceStatus'}
    Source: {$ref: './components/common.yaml#/Source'}
    Money: {$ref: './components/common.yaml#/Money'}
    Job: {$ref: './components/common.yaml#/Job'}
    VersionStamp: {$ref: './components/common.yaml#/VersionStamp'}
    ObjectType: {$ref: './components/reference.yaml#/ObjectType'}
    ParameterDef: {$ref: './components/reference.yaml#/ParameterDef'}
    ProcessDef: {$ref: './components/reference.yaml#/ProcessDef'}
    Norm: {$ref: './components/reference.yaml#/Norm'}
    Product: {$ref: './components/catalog.yaml#/Product'}
    ProductDetail: {$ref: './components/catalog.yaml#/ProductDetail'}
    Spec: {$ref: './components/catalog.yaml#/Spec'}
    Project: {$ref: './components/projects.yaml#/Project'}
    ProjectParam: {$ref: './components/projects.yaml#/ProjectParam'}
    ProcessDemand: {$ref: './components/projects.yaml#/ProcessDemand'}
    Layout: {$ref: './components/projects.yaml#/Layout'}
    MatchingResult: {$ref: './components/analysis.yaml#/MatchingResult'}
    Candidate: {$ref: './components/analysis.yaml#/Candidate'}
    Scenario: {$ref: './components/analysis.yaml#/Scenario'}
    CalculationRun: {$ref: './components/analysis.yaml#/CalculationRun'}
    CalculationTrace: {$ref: './components/analysis.yaml#/CalculationTrace'}
    Metrics: {$ref: './components/analysis.yaml#/Metrics'}
    ComparisonTable: {$ref: './components/analysis.yaml#/ComparisonTable'}
    SensitivityResult: {$ref: './components/analysis.yaml#/SensitivityResult'}
    MonteCarloResult: {$ref: './components/analysis.yaml#/MonteCarloResult'}
    SimulationRun: {$ref: './components/simulation.yaml#/SimulationRun'}
    SimulationSummary: {$ref: './components/simulation.yaml#/SimulationSummary'}
    SimulationReplay: {$ref: './components/simulation.yaml#/SimulationReplay'}
    SimEvent: {$ref: './components/simulation.yaml#/SimEvent'}
    Report: {$ref: './components/platform.yaml#/Report'}
    User: {$ref: './components/platform.yaml#/User'}
