openapi: 3.1.0
info:
  title: RoboScope API
  version: 0.2.0
  license: {name: MIT, identifier: MIT}
  summary: Платформа экспресс-оценки роботизации объекта (ЛЦТ 2026, задача №1, ФЦ БАС)
  description: |
    Контракт между фронтендом и бэкендом. Источник истины по API: бэкенд обязан ему соответствовать,
    фронтенд разрабатывается по нему с mock-сервером (см. README.md рядом).

    **Конвенции**
    - Префикс `/api/v1` входит в путь (без `servers`), чтобы mock, vite-proxy и vercel rewrite совпадали.
    - Авторизация: `Authorization: Bearer <access>`. Для `X-Client: web` refresh-токен живёт в httpOnly-cookie,
      обновление требует `X-CSRF-Token`. Гостевые эндпоинты помечены `security: []`.
    - Ошибки: всегда `Problem` с `error_code` из закрытого списка.
    - Деньги — в рублях (`amount_rub`), не в миллионах. Время — ISO 8601 UTC.
    - Любое значение, влияющее на расчёт, несёт `provenance` (статус и источник).
    - Долгие операции (симуляция, Монте-Карло, отчёты, обогащение) возвращают 202 + `Job`/`SimulationRun`;
      прогресс — SSE `GET /api/v1/jobs/{job_id}/stream` или опрос.
    - Пагинация: `page` (с 1) и `page_size`; ответ содержит `items`, `total`, `page`, `page_size`.
    - Версии входов (`VersionStamp`) сохраняются с каждым расчётом — расчёт воспроизводим (ТЗ 3.1.5).

tags:
  - {name: system, description: "Здоровье, версии, фоновые задачи"}
  - {name: auth, description: "Регистрация, вход, профиль, ключи API"}
  - {name: reference, description: "Справочники — типы объектов, параметры, процессы, нормативы"}
  - {name: catalog, description: "Каталог решений — поиск, карточки, сравнение"}
  - {name: projects, description: "Проекты пользователя"}
  - {name: params, description: "Параметры объекта, импорт, валидация, процессы"}
  - {name: layout, description: "Планировка объекта для 2D-карты и симуляции"}
  - {name: matching, description: "Подбор решений по процессам"}
  - {name: scenarios, description: "Сценарии роботизации"}
  - {name: calculations, description: "Экономика, трасса расчёта, сравнение, чувствительность, Монте-Карло"}
  - {name: simulation, description: "Имитация работы роботов и данные для 2D-плеера"}
  - {name: reports, description: "Отчёты PDF / Excel / DOCX"}
  - {name: assist, description: "Ассистент (LLM) — импорт, объяснения, проверка допущений"}
  - {name: demo, description: "Демо для гостя без авторизации"}
  - {name: support, description: "Меры господдержки"}
  - {name: rfq, description: "Запрос коммерческого предложения вендорам"}
  - {name: admin, description: "Администрирование каталога, нормативов, пользователей"}
  - {name: integrations, description: "Импорт из внешних систем по ключу API"}

