# Кабинет производителя (роль vendor, ТЗ 3.1.1): заявки на правку каталога с модерацией, спрос на продукты.

ProposalStatus:
  type: string
  description: pending — на модерации; approved — правка в каталоге; rejected — отказ с причиной; withdrawn — отозвана вендором.
  enum: [pending, approved, rejected, withdrawn]

ProposalKind:
  type: string
  description: update — правка существующей карточки; new_product — новый продукт производителя.
  enum: [new_product, update]

ProposalWrite:
  type: object
  required: [comment]
  properties:
    product_id: {type: [string, "null"], format: uuid, description: "null — предложить новый продукт"}
    card:
      description: Новая карточка и цены; производитель берётся из привязки учётной записи, отметки реестра и испытаний ставит только администратор.
      oneOf: [{$ref: './catalog.yaml#/ProductWrite'}, {type: 'null'}]
    specs:
      type: array
      description: Характеристики с источником; сохраняются со статусом vendor_claim, у нового продукта — после его одобрения.
      items: {$ref: './catalog.yaml#/SpecWrite'}
    comment: {type: string, minLength: 1, maxLength: 2000, description: "Что изменилось и почему — для модератора"}

ProposalPerson:
  type: object
  required: [name, email]
  properties:
    name: {type: string}
    email: {type: string, format: email}

Proposal:
  type: object
  required: [id, kind, status, manufacturer, product_name, specs, comment, created_at, catalog_version, product_changed_since]
  properties:
    id: {type: string, format: uuid}
    kind: {$ref: '#/ProposalKind'}
    status: {$ref: '#/ProposalStatus'}
    manufacturer: {$ref: './catalog.yaml#/Manufacturer'}
    product_id: {type: [string, "null"], format: uuid, description: "У одобренного нового продукта — созданная карточка"}
    product_name: {type: string}
    card:
      oneOf: [{$ref: './catalog.yaml#/ProductWrite'}, {type: 'null'}]
    specs: {type: array, items: {$ref: './catalog.yaml#/SpecWrite'}}
    comment: {type: string}
    author:
      oneOf: [{$ref: '#/ProposalPerson'}, {type: 'null'}]
    created_at: {type: string, format: date-time}
    catalog_version: {type: string, description: "Версия каталога, на которой вендор готовил заявку"}
    product_changed_since: {type: boolean, description: "Карточку меняли после подачи заявки — сверьте перед решением"}
    reviewed_at: {type: [string, "null"], format: date-time}
    reviewer_name: {type: [string, "null"]}
    review_comment: {type: [string, "null"]}

ProposalList:
  type: object
  required: [items, total]
  properties:
    items: {type: array, items: {$ref: '#/Proposal'}}
    total: {type: integer}

ProposalReview:
  type: object
  required: [decision]
  properties:
    decision: {type: string, enum: [approve, reject]}
    comment: {type: [string, "null"], maxLength: 2000, description: "Обязателен при отказе"}
    specs_status:
      type: string
      enum: [vendor_claim, confirmed]
      default: vendor_claim
      description: С каким статусом принять ТТХ — заявка производителя или подтверждено (администратор проверил источник).

KeySpec:
  type: object
  required: [key, name]
  properties:
    key: {type: string}
    name: {type: string}

VendorProduct:
  type: object
  required: [product, missing_key_specs, relevant_projects, scenarios_count, manual_adds]
  properties:
    product: {$ref: './catalog.yaml#/Product'}
    missing_key_specs:
      type: array
      description: Ключевые ТТХ типа решения без значения — подбор не может их проверить и ставит «требует проверки».
      items: {$ref: '#/KeySpec'}
    relevant_projects: {type: integer, description: "Проекты платформы с типами объектов этого продукта"}
    scenarios_count: {type: integer, description: "Сценарии, в которые продукт включён"}
    manual_adds: {type: integer, description: "Сколько раз пользователи добавили продукт в подбор вручную"}
    pending_proposal_id: {type: [string, "null"], format: uuid}

VendorGap:
  type: object
  required: [object_type, process_key, process_name, no_fit_count, solution_types]
  properties:
    object_type: {type: string}
    process_key: {type: string}
    process_name: {type: string}
    no_fit_count: {type: integer, description: "Проекты, где у процесса нет продукта в каталоге"}
    solution_types: {type: array, items: {type: string}, description: "Ваши типы решений, которые этот процесс использует"}

VendorOverview:
  type: object
  description: Спрос — агрегаты по всем проектам платформы без названий, владельцев и параметров (ТЗ 4.4.3).
  required: [manufacturer, products, projects_total, projects_by_object_type, scenarios_with_products, proposals_by_status, gaps]
  properties:
    manufacturer: {$ref: './catalog.yaml#/Manufacturer'}
    products: {type: array, items: {$ref: '#/VendorProduct'}}
    projects_total: {type: integer}
    projects_by_object_type: {type: object, additionalProperties: {type: integer}}
    scenarios_with_products: {type: integer}
    proposals_by_status: {type: object, additionalProperties: {type: integer}}
    gaps: {type: array, items: {$ref: '#/VendorGap'}}

FitReason:
  type: object
  required: [code, text, count]
  properties:
    code: {type: string}
    text: {type: string, description: "Пример формулировки из одного проекта"}
    spec_key: {type: [string, "null"]}
    count: {type: integer}

FitMissing:
  type: object
  required: [spec_key, name, count]
  properties:
    spec_key: {type: string}
    name: {type: string}
    count: {type: integer}

ProductFit:
  type: object
  required: [product_id, appearances, fit, check, excluded, manual, top3, blocking, missing]
  properties:
    product_id: {type: string, format: uuid}
    appearances: {type: integer, description: "Сколько раз продукт был кандидатом (проект × процесс)"}
    fit: {type: integer}
    check: {type: integer}
    excluded: {type: integer}
    manual: {type: integer}
    top3: {type: integer, description: "Сколько раз продукт в тройке лучших среди подходящих"}
    blocking: {type: array, items: {$ref: '#/FitReason'}, description: "Частые причины исключения"}
    missing: {type: array, items: {$ref: '#/FitMissing'}, description: "Каких ТТХ не хватило подбору для проверки"}

VendorFit:
  type: object
  description: Подбор по последним проектам платформы с объектами продуктов; только счётчики, без данных проектов.
  required: [projects_analysed, computed_at, products]
  properties:
    projects_analysed: {type: integer}
    computed_at: {type: string, format: date-time}
    products: {type: array, items: {$ref: '#/ProductFit'}}

RfqStatus:
  type: string
  description: sent — ждёт ответа; answered — производитель назвал цену и срок; declined — отказ с причиной.
  enum: [sent, answered, declined]

RfqRequest:
  type: object
  required: [scenario_id, items]
  properties:
    scenario_id: {type: string, format: uuid}
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [product_id]
        properties:
          product_id: {type: string, format: uuid}
          quantity: {type: [integer, "null"], minimum: 1, description: "Сколько единиц в сценарии"}
    message: {type: [string, "null"], maxLength: 2000}
    share_contact: {type: boolean, default: false, description: "Показать производителю имя, почту и компанию"}

Rfq:
  type: object
  description: Запрос КП. Производитель видит снимок объекта на момент запроса, а не живой проект.
  required: [id, status, product, object, created_at]
  properties:
    id: {type: string, format: uuid}
    status: {$ref: '#/RfqStatus'}
    project_id: {type: [string, "null"], format: uuid}
    scenario_id: {type: [string, "null"], format: uuid}
    product: {$ref: './catalog.yaml#/Product'}
    quantity: {type: [integer, "null"]}
    message: {type: [string, "null"]}
    object:
      type: object
      required: [object_type, object_type_name, industry, params, processes]
      properties:
        object_type: {type: string}
        object_type_name: {type: string}
        industry: {type: string}
        params:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key: {type: string}
              name: {type: string}
              value: {}
              unit: {type: [string, "null"]}
        processes:
          type: array
          items: {type: object, required: [key, name], properties: {key: {type: string}, name: {type: string}}}
    contact:
      description: Только производителю и только с согласия заказчика.
      oneOf:
        - type: object
          required: [name, email]
          properties:
            name: {type: string}
            email: {type: string}
            organization: {type: [string, "null"]}
        - {type: 'null'}
    created_at: {type: string, format: date-time}
    price:
      oneOf: [{$ref: './common.yaml#/Money'}, {type: 'null'}]
    lead_time_weeks: {type: [integer, "null"]}
    response_message: {type: [string, "null"]}
    responded_at: {type: [string, "null"], format: date-time}

RfqList:
  type: object
  required: [items, total]
  properties:
    items: {type: array, items: {$ref: '#/Rfq'}}
    total: {type: integer}

RfqReply:
  type: object
  required: [decision]
  properties:
    decision: {type: string, enum: [offer, decline]}
    price:
      description: Цена за единицу; обязательна для offer.
      oneOf: [{$ref: './common.yaml#/Money'}, {type: 'null'}]
    lead_time_weeks: {type: [integer, "null"], minimum: 0, maximum: 260}
    message: {type: [string, "null"], maxLength: 2000, description: "Обязателен при отказе"}

ManufacturerList:
  type: object
  required: [items]
  properties:
    items: {type: array, items: {$ref: './catalog.yaml#/Manufacturer'}}
