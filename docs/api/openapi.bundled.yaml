        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CalculationRun:
      type: object
      description: Полный результат расчёта сценария. Хранится вечно вместе с версиями входов (ТЗ 3.1.5).
      required:
        - id
        - scenario_id
        - versions
        - status
        - sizing
        - capex
        - opex_year
        - baseline_cost_year
        - effect_year
        - cashflow
        - metrics
        - interpretation
        - risks
      properties:
        id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        scenario_kind:
          $ref: '#/components/schemas/ScenarioKind'
        versions:
          $ref: '#/components/schemas/VersionStamp'
        status:
          type: string
          enum:
            - fresh
            - stale
        duration_ms:
          type: integer
        sizing:
          type: array
          items:
            $ref: '#/components/schemas/SizingResult'
        capex:
          $ref: '#/components/schemas/CostBreakdown'
        opex_year:
          $ref: '#/components/schemas/CostBreakdown'
        baseline_cost_year:
          $ref: '#/components/schemas/CostBreakdown'
        scenario_cost_year:
          $ref: '#/components/schemas/CostBreakdown'
        effect_year:
          type: object
          required:
            - total_rub_year
            - items
          properties:
            total_rub_year:
              type: number
            items:
              type: array
              items:
                $ref: '#/components/schemas/EffectItem'
        cashflow:
          type: object
          required:
            - monthly
            - yearly
          properties:
            monthly:
              type: array
              items:
                $ref: '#/components/schemas/CashflowPoint'
            yearly:
              type: array
              items:
                $ref: '#/components/schemas/CashflowPoint'
            ramp_up_months:
              type: integer
              description: Месяцы внедрения и разгона до полного эффекта
            upfront_rub:
              type: number
              description: Вложения в момент 0 (свои средства или первый взнос); в monthly они входят в месяц 1
        metrics:
          $ref: '#/components/schemas/Metrics'
        interpretation:
          $ref: '#/components/schemas/Interpretation'
        risks:
          type: array
          items:
            $ref: '#/components/schemas/Risk'
        warnings:
          type: array
          items:
            type: string
        assumptions_used:
          type: array
          description: Все нормативы и допущения, участвовавшие в расчёте — раздел «Допущения» отчёта.
          items:
            $ref: '#/components/schemas/Norm'
        calibration:
          type:
            - object
            - 'null'
          description: Сверка с методикой ФЦ БАС на их модельном кейсе (если применимо к типу решения).
          properties:
            reference:
              type: string
              example: ФЦ БАС, сценарий «Складские мобильные роботы», март 2026
            deviation_pct:
              type:
                - number
                - 'null'
            note:
              type:
                - string
                - 'null'
            within_tolerance:
              type:
                - boolean
                - 'null'
            checks:
              type: array
              description: Пересчёт модельного кейса ФЦ БАС нашими формулами и нормативами — каждое число против их числа.
              items:
                type: object
                required:
                  - key
                  - name
                  - ours
                  - reference
                  - deviation_pct
                properties:
                  key:
                    type: string
                    example: fcbas_warehouse_amr.robot_cost
                  name:
                    type: string
                  ours:
                    type: number
                  reference:
                    type: number
                  deviation_pct:
                    type: number
                  unit:
                    type:
                      - string
                      - 'null'
                  tolerance_pct:
                    type:
                      - number
                      - 'null'
    CalculationTrace:
      type: object
      description: 'Полный граф расчёта: каждая метрика → формула → входы → источники. Основа Excel с живыми формулами.'
