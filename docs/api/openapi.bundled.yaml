openapi: 3.1.0
info:
  title: РобоМера API
  version: 0.8.0
  license:
    name: MIT
    identifier: MIT
  summary: Платформа экспресс-оценки роботизации объекта (ЛЦТ 2026, задача №1, ФЦ БАС)
  description: |
    Контракт между фронтендом и бэкендом. Источник истины по API: бэкенд обязан ему соответствовать,
    фронтенд разрабатывается по нему с mock-сервером (см. README.md рядом).

    **Конвенции**
    - Префикс `/api/v1` входит в путь (без `servers`), чтобы mock, vite-proxy и vercel rewrite совпадали.
    - Авторизация: `Authorization: Bearer <access>`. Для `X-Client: web` refresh-токен живёт в httpOnly-cookie,
      обновление требует `X-CSRF-Token`. Гостевые эндпоинты помечены `security: []`.
    - Ошибки: всегда `Problem` с `error_code` из закрытого списка.
    - Деньги — в рублях (`amount_rub`), не в миллионах. Время — ISO 8601 UTC.
    - Любое значение, влияющее на расчёт, несёт `provenance` (статус и источник).
    - Долгие операции (симуляция, Монте-Карло, отчёты, обогащение) возвращают 202 + `Job`/`SimulationRun`;
      прогресс — SSE `GET /api/v1/jobs/{job_id}/stream` или опрос.
    - Пагинация: `page` (с 1) и `page_size`; ответ содержит `items`, `total`, `page`, `page_size`.
    - Версии входов (`VersionStamp`) сохраняются с каждым расчётом — расчёт воспроизводим (ТЗ 3.1.5).
security:
  - bearerAuth: []
tags:
  - name: system
    description: Здоровье, версии, фоновые задачи
  - name: auth
    description: Регистрация, вход, профиль, ключи API
  - name: reference
    description: Справочники — типы объектов, параметры, процессы, нормативы
  - name: catalog
    description: Каталог решений — поиск, карточки, сравнение
  - name: organizations
    description: 'Организации: общие проекты, участники, приглашения по email'
  - name: projects
    description: Проекты пользователя и его организаций
  - name: params
    description: Параметры объекта, импорт, валидация, процессы
  - name: layout
    description: Планировка объекта для 2D-карты и симуляции
  - name: matching
    description: Подбор решений по процессам
  - name: scenarios
    description: Сценарии роботизации
  - name: calculations
    description: Экономика, трасса расчёта, сравнение, чувствительность, Монте-Карло
  - name: simulation
    description: Имитация работы роботов и данные для 2D-плеера
  - name: reports
    description: Отчёты PDF / Excel / DOCX
  - name: assist
    description: Ассистент (LLM) — импорт, объяснения, проверка допущений
  - name: demo
    description: Демо для гостя без авторизации
  - name: support
    description: Меры господдержки
  - name: rfq
    description: Запрос коммерческого предложения вендорам
  - name: vendor
    description: 'Кабинет производителя: заявки на правку каталога, спрос на продукты'
  - name: admin
    description: Администрирование каталога, нормативов, пользователей
  - name: integrations
    description: Импорт из внешних систем по ключу API
paths:
  /api/v1/health:
    get:
      tags:
        - system
      operationId: health
      summary: Liveness (без внешних вызовов)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/ready:
    get:
      tags:
        - system
      operationId: ready
      summary: Readiness (БД, Redis, воркер)
      security: []
      responses:
        '200':
          description: Готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/version:
    get:
      tags:
        - system
      operationId: version
      summary: Версии приложения, движка, каталога и нормативов
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVersion'
  /api/v1/jobs/{job_id}:
    get:
      tags:
        - system
      operationId: getJob
      summary: Состояние фоновой задачи
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{job_id}/stream:
    get:
      tags:
        - system
      operationId: streamJob
      summary: SSE-поток прогресса задачи
      description: |
        `text/event-stream`. События: `progress` (ProgressEvent), `done` (ProgressEvent со status=done), `error` (Problem).
        Поток закрывается после done/error. Для симуляции в `partial` приходят бегущие KPI.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/register:
    post:
      tags:
        - auth
      operationId: register
      summary: Регистрация пользователя
      security: []
      parameters:
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Вход
      security: []
      parameters:
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshTokens
      summary: Обновить пару токенов
      description: Для web refresh-токен берётся из httpOnly-cookie, требуется заголовок X-CSRF-Token; для других клиентов — refresh-токен в теле.
      security: []
      parameters:
        - $ref: '#/components/parameters/XClient'
        - name: X-CSRF-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: Выход (отзыв refresh-токена)
      responses:
        '204':
          description: Вышли
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me:
    get:
      tags:
        - auth
      operationId: getMe
      summary: Текущий пользователь
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - auth
      operationId: updateMe
      summary: Обновить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me/api-keys:
    get:
      tags:
        - auth
      operationId: listApiKeys
      summary: Ключи API пользователя (для интеграций WMS/ERP/1С)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
    post:
      tags:
        - auth
      operationId: createApiKey
      summary: Создать ключ API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: Создан; secret показывается один раз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
  /api/v1/me/api-keys/{key_id}:
    delete:
      tags:
        - auth
      operationId: revokeApiKey
      summary: Отозвать ключ API
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Отозван
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/invitations:
    get:
      tags:
        - organizations
      operationId: listMyInvitations
      summary: Приглашения в организации, ждущие ответа
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingInvitationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/invitations/{invitation_id}/accept:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - organizations
      operationId: acceptInvitation
      summary: Принять приглашение — стать участником организации
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/invitations/{invitation_id}/decline:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - organizations
      operationId: declineInvitation
      summary: Отклонить приглашение
      responses:
        '204':
          description: Отклонено
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organizations:
    get:
      tags:
        - organizations
      operationId: listOrganizations
      summary: Организации пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - organizations
      operationId: createOrganization
      summary: Создать организацию (создатель — владелец)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/organizations/{organization_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - organizations
      operationId: getOrganization
      summary: 'Организация: участники и ожидающие приглашения'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - organizations
      operationId: updateOrganization
      summary: Переименовать организацию (владелец)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - organizations
      operationId: deleteOrganization
      summary: Удалить организацию вместе с её проектами (владелец)
      responses:
        '204':
          description: Удалена
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organizations/{organization_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags:
        - organizations
      operationId: inviteToOrganization
      summary: Пригласить пользователя по email (владелец)
      description: Приглашение появляется у адресата в уведомлениях; незарегистрированный адрес увидит его после регистрации.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/organizations/{organization_id}/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - organizations
      operationId: revokeOrganizationInvitation
      summary: Отозвать приглашение (владелец)
      responses:
        '204':
          description: Отозвано
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organizations/{organization_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - organizations
      operationId: removeOrganizationMember
      summary: Исключить участника (владелец) или выйти из организации (свой user_id)
      responses:
        '204':
          description: Исключён
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/object-types:
    get:
      tags:
        - reference
      operationId: listObjectTypes
      summary: Типы объектов с группами параметров и процессами
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObjectType'
  /api/v1/object-types/{object_type}:
    get:
      tags:
        - reference
      operationId: getObjectType
      summary: Тип объекта — схема формы параметров
      security: []
      parameters:
        - name: object_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectTypeKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectType'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/object-types/{object_type}/template.xlsx:
    get:
      tags:
        - reference
      operationId: downloadImportTemplate
      summary: Excel-шаблон для загрузки параметров (ТЗ 3.2.3)
      security: []
      parameters:
        - name: object_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectTypeKey'
      responses:
        '200':
          description: Файл xlsx с листом параметров, единицами, подсказками и примером
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/solution-types:
    get:
      tags:
        - reference
      operationId: listSolutionTypes
      summary: Типы роботизированных решений
      security: []
      parameters:
        - name: object_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObjectTypeKey'
        - name: process_key
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SolutionType'
  /api/v1/industries:
    get:
      tags:
        - reference
      operationId: listIndustries
      summary: Отрасли каталога
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Industry'
  /api/v1/norms:
    get:
      tags:
        - reference
      operationId: listNorms
      summary: Реестр нормативов расчётной модели с источниками
      description: Показывается пользователю на экране «Методика» и в отчёте. Каждый норматив имеет источник и обоснование.
      security: []
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
          description: Версия набора; по умолчанию текущая
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NormCategory'
        - name: object_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObjectTypeKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - items
                properties:
                  version:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Norm'
  /api/v1/norm-sets:
    get:
      tags:
        - reference
      operationId: listNormSets
      summary: Версии наборов нормативов
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NormSet'
  /api/v1/catalog/products:
    get:
      tags:
        - catalog
      operationId: listProducts
      summary: Каталог продуктов с фильтрами, поиском и сортировкой (ТЗ 3.3.7)
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema:
            type: string
          description: Полнотекстовый или семантический поиск
        - name: object_type
          in: query
          schema:
            $ref: '#/components/schemas/ObjectTypeKey'
        - name: process_key
          in: query
          schema:
            type: string
        - name: solution_type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: industry
          in: query
          schema:
            type: string
        - name: manufacturer_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProductStatus'
          style: form
          explode: false
        - name: badge
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Badge'
          style: form
          explode: false
        - name: price_min_rub
          in: query
          schema:
            type: number
        - name: price_max_rub
          in: query
          schema:
            type: number
        - name: payload_min_kg
          in: query
          schema:
            type: number
        - name: min_completeness
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - name
              - price_asc
              - price_desc
              - completeness
              - trl
              - updated
            default: relevance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
  /api/v1/catalog/facets:
    get:
      tags:
        - catalog
      operationId: getCatalogFacets
      summary: Значения фильтров с количествами
      security: []
      parameters:
        - name: object_type
          in: query
          schema:
            $ref: '#/components/schemas/ObjectTypeKey'
        - name: process_key
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFacets'
  /api/v1/catalog/spec-keys:
    get:
      tags:
        - catalog
      operationId: listSpecKeys
      summary: Словарь характеристик (ключ, название, группа, единица, участие в жёстких проверках)
