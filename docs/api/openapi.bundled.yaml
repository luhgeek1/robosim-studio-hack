          type:
            - number
            - 'null'
        npv_rub:
          type: number
    FleetSweepResult:
      type: object
      description: |
        Минимальное N, при котором каждый из `sim_replications` прогонов пикового режима держит SLA не ниже цели (D-029).
        Поиск идёт от оценки по первому прогону; прогоны разных N видят одинаковый поток задач (общие случайные числа).
        Результат записывается в позицию сценария: следующий расчёт берёт N из имитации (`count_result.source = simulated`).
      required:
        - process_key
        - points
        - recommended_count
        - explanation
      properties:
        process_key:
          type: string
        points:
          type: array
          items:
            type: object
            required:
              - count
              - sla_achieved_pct
              - utilization
              - throughput_per_hour
            properties:
              count:
                type: integer
              sla_achieved_pct:
                type: number
                description: Среднее по повторам
              sla_min_pct:
                type:
                  - number
                  - 'null'
                description: Худший повтор
              passed:
                type: boolean
              runs:
                type: integer
              utilization:
                type: number
              throughput_per_hour:
                type: number
              queue_max:
                type: integer
              robots_total:
                type:
                  - integer
                  - 'null'
                description: N плюс резерв — как в сценарии после применения
              capex_rub:
                type:
                  - number
                  - 'null'
              payback_years:
                type:
                  - number
                  - 'null'
                description: 'null, если N не держит SLA: такой парк не выполняет работу'
              npv_rub:
                type:
                  - number
                  - 'null'
              simulation_id:
                type:
                  - string
                  - 'null'
                format: uuid
        recommended_count:
          type:
            - integer
            - 'null'
          description: 'null — даже тройной парк не выполняет SLA: ограничение не в роботах'
        analytic_count:
          type:
            - integer
            - 'null'
        target_pct:
          type:
            - number
            - 'null'
        simulation_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Прогон рекомендованного N с журналом для плеера
        applied:
          type: boolean
          description: N записано в сценарий
        by_formula:
          oneOf:
            - $ref: '#/components/schemas/FleetEconomics'
            - type: 'null'
          description: N по формуле цикла и его экономика
        by_simulation:
          oneOf:
            - $ref: '#/components/schemas/FleetEconomics'
            - type: 'null'
          description: N по имитации — то, что берёт расчёт
        job_id:
          type:
            - string
            - 'null'
          format: uuid
        computed_at:
          type:
            - string
            - 'null'
          format: date-time
        explanation:
          type: string
          example: 12 — минимальное N с SLA ≥ 95 %; 11 даёт 91 %; 14 — простой 38 %
