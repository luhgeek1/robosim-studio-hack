        «Что уточнить при обследовании»: параметры с наибольшим влиянием на результат, которые при этом являются
        допущениями или значениями по умолчанию. Прямой ответ на ТЗ 3.7.5 и мост к пилоту.
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - key
              - name
              - status
              - swing
              - rank
              - recommendation
            properties:
              key:
                type: string
              name:
                type: string
              status:
                $ref: '#/components/schemas/ProvenanceStatus'
              current_value:
                oneOf:
