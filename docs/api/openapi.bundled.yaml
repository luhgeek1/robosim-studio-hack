      tags:
        - scenarios
      operationId: copyScenario
      summary: Копировать сценарий (например, «покупка» → «RaaS» с тем же составом)
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                kind:
                  $ref: '#/components/schemas/ScenarioKind'
