          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/TraceItem'
        undocumented_constants:
          type: integer
          description: Должно быть 0 — счётчик для слайда
    Metrics:
      type: object
      description: 'Все показатели ТЗ 3.5.2 + классические финансовые (по Q&A: ROI с вычетом CAPEX, окупаемость простая и дисконтированная).'
      required:
        - capex_rub
        - opex_rub_year
        - baseline_cost_rub_year
        - effect_rub_year
        - payback_years
        - roi_pct
        - tco_rub
        - horizon_years
      properties:
        capex_rub:
          type: number
        opex_rub_year:
          type: number
          description: Дополнительный OPEX роботизации в первый полный год
        baseline_cost_rub_year:
          type: number
        scenario_cost_rub_year:
          type: number
        opex_delta_rub_year:
          type: number
          description: Изменение OPEX относительно базы (отрицательное = экономия)
        effect_rub_year:
          type: number
          description: Чистый годовой экономический эффект
        payback_years:
          type:
            - number
            - 'null'
          description: null — не окупается в горизонте
        discounted_payback_years:
          type:
            - number
            - 'null'
        roi_pct:
          type: number
          description: (Σэффект за горизонт − CAPEX) / CAPEX × 100
        npv_rub:
          type: number
        irr_pct:
          type:
            - number
            - 'null'
        tco_rub:
          type: number
          description: CAPEX + ΣOPEX за горизонт с заменами
        tco_baseline_rub:
          type: number
        fte_released:
          type: number
        robots_total:
          type: integer
        throughput_gain_pct:
          type:
            - number
            - 'null'
        sla_after:
          type:
            - number
            - 'null'
        discount_rate_pct:
          type: number
        horizon_years:
          type: integer
    ComparisonTable:
      type: object
      description: 'Сводная таблица сценариев (ТЗ 2.1.3, 3.5.5, 3.7.1): база + не менее двух сценариев роботизации.'
      required:
        - project_id
        - scenarios
        - rows
        - verdict
      properties:
        project_id:
          type: string
          format: uuid
        scenarios:
          type: array
          items:
            type: object
            required:
              - scenario_id
              - name
              - kind
              - calculation_id
              - metrics
            properties:
              scenario_id:
                type: string
                format: uuid
              name:
                type: string
              kind:
                $ref: '#/components/schemas/ScenarioKind'
              calculation_id:
                type: string
                format: uuid
              status:
                type: string
                enum:
                  - fresh
                  - stale
              metrics:
                $ref: '#/components/schemas/Metrics'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonRow'
        recommendation:
          type: object
          properties:
            scenario_id:
              type:
                - string
                - 'null'
              format: uuid
            rationale:
              type: array
              items:
                type: string
            caveats:
              type: array
              items:
                type: string
        verdict:
          $ref: '#/components/schemas/Interpretation'
        cashflow_overlay:
          type: object
          description: |
            Накопленный денежный поток каждого сценария относительно «как сейчас» по годам, с точки 0 (старт, минус
            первоначальные вложения). База — линия нуля; пересечение нуля — окупаемость. Один график на все сценарии.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/CashflowPoint'
    SensitivityResult:
      type: object
      required:
        - metric
        - base_value
        - items
      properties:
        metric:
          type: string
        base_value:
          type: number
        items:
          type: array
          description: Отсортировано по размаху — готовая торнадо-диаграмма.
          items:
            type: object
            required:
              - key
              - name
              - low_input
              - high_input
              - metric_at_low
              - metric_at_high
              - swing
              - rank
            properties:
              key:
                type: string
