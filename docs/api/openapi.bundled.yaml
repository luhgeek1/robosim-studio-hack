      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - name
                        - group
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        group:
                          $ref: '#/components/schemas/SpecGroup'
                        unit:
                          type:
                            - string
                            - 'null'
                        is_key_constraint:
                          type: boolean
                        solution_types:
                          type: array
                          items:
                            type: string
