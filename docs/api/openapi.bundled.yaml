        '201':
          description: Копия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
  /api/v1/scenarios/{scenario_id}/calculate:
    post:
      tags:
        - calculations
      operationId: calculateScenario
      summary: Рассчитать экономику сценария (синхронно, ≤ 10 с)
      description: |
        Считает количество роботов (аналитически + по последней симуляции сценария, если она есть), CAPEX, OPEX, эффект,
        денежный поток, метрики, интерпретацию и риски. Результат сохраняется с версиями входов.
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                use_simulation:
                  type: boolean
                  default: true
                  description: Брать N из последней успешной симуляции
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationRun'
        '409':
          description: Сценарий не полон (нет продуктов) или параметры невалидны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/scenarios/{scenario_id}/sensitivity:
