            - analytic
            - simulated
            - manual
        simulation_id:
          type:
            - string
            - 'null'
          format: uuid
        explanation:
          type: string
          example: Аналитически 10; при 11 симуляция даёт SLA 91 %; при 12 — 97 %; резерв +1 на отказ
    ScenarioItem:
      type: object
