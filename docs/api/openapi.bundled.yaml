components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен из /auth/login или /auth/refresh
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Ключ интеграции из /me/api-keys (только эндпоинты /integrations/*)
  schemas:
    Problem:
      type: object
      description: |
        Стандартный конверт ошибки (RFC 7807 + error_code). Возвращается на любой 4xx/5xx.
        Фронт разбирает его одним парсером и маппит error_code → текст для пользователя.
      required:
        - type
        - title
        - status
        - detail
        - error_code
        - instance
        - timestamp
        - request_id
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Проект не найден или недоступен
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        instance:
          type: string
          example: /api/v1/projects/2f4c…
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          example: 8f1c0d2e-…
        details:
          type: array
          description: Детали валидации (для 422) или доменные подробности.
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string
              code:
                type: string
                description: Доменный код поля, например RANGE_EXCEEDED
    ErrorCode:
      type: string
      description: Закрытый список кодов ошибок. Новые коды добавляются только через правку контракта.
      enum:
        - BAD_REQUEST
        - REQUEST_VALIDATION_ERROR
        - UNAUTHORIZED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - HTTP_ERROR
        - INTERNAL_ERROR
        - PROJECT_LOCKED
        - PARAMS_INVALID
        - IMPORT_FAILED
        - FILE_TOO_LARGE
        - UNSUPPORTED_FILE_TYPE
        - OBJECT_TYPE_NOT_SUPPORTED
        - NO_CANDIDATES
        - SCENARIO_INCOMPLETE
        - CALCULATION_FAILED
        - SIMULATION_FAILED
        - JOB_NOT_READY
        - LLM_UNAVAILABLE
        - DEMO_LIMIT
    PValue:
      type: object
      description: Значение с единицей измерения и происхождением. Базовый кирпич всех данных платформы.
      required:
        - value
        - provenance
      properties:
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
            - type: 'null'
        unit:
          type:
            - string
            - 'null'
          example: м²
        provenance:
          $ref: '#/components/schemas/Provenance'
      example:
        value: 20000
        unit: м²
        provenance:
          status: default
          source:
            id: 6f1d2c3b-4a5e-4f60-9b7c-1d2e3f4a5b6c
            kind: organizer_dataset
            title: Датасеты_хакатон.xlsx / Склад
            retrieved_at: '2026-09-15'
    Provenance:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ProvenanceStatus'
        source:
          oneOf:
            - $ref: '#/components/schemas/Source'
            - type: 'null'
        confidence:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
          description: Уверенность для imported/llm_suggested
        raw_value:
          type:
            - string
            - 'null'
          description: Исходная строка из файла или текста, из которой извлечено значение
        note:
          type:
            - string
            - 'null'
        changed_by:
          type:
            - string
            - 'null'
          description: Кто последним менял (email или system)
        changed_at:
          type:
            - string
            - 'null'
          format: date-time
    ProvenanceStatus:
      type: string
      description: |
        Откуда взялось значение и можно ли ему верить.
        user — ввёл пользователь; imported — из файла пользователя; llm_suggested — предложил ассистент, не подтверждено;
        default — значение по умолчанию из справочника (с источником); assumption — допущение команды с обоснованием;
        derived — вычислено из других параметров; confirmed — подтверждено первичным источником (для ТТХ и нормативов);
        vendor_claim — заявка производителя без независимого подтверждения; missing — данных нет.
      enum:
        - user
        - imported
        - llm_suggested
        - default
        - assumption
        - derived
        - confirmed
        - vendor_claim
        - missing
    Source:
      type: object
      description: Источник значения. Показывается пользователю как бейдж и в отчёте в разделе «Источники».
      required:
        - id
        - kind
        - title
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SourceKind'
        title:
          type: string
          example: Датасеты_хакатон.xlsx, лист «Легенда»
        url:
          type:
            - string
            - 'null'
          format: uri
        retrieved_at:
          type:
            - string
            - 'null'
          format: date
        note:
          type:
            - string
            - 'null'
          description: Пояснение, например «цена с НДС, без доставки и ПНР»
    Money:
      type: object
      required:
        - amount_rub
      properties:
        amount_rub:
          type: number
          description: Сумма в рублях (не в млн)
        vat_included:
          type: boolean
          default: true
      example:
        amount_rub: 2700000
        vat_included: true
    Job:
      type: object
      description: |
        Фоновая задача. Долгие операции (симуляция, Монте-Карло, отчёт, обогащение) возвращают Job сразу;
        результат забирается по result_url или по SSE-потоку прогресса.
      required:
        - id
        - type
        - status
        - progress
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: number
          minimum: 0
          maximum: 1
        stage:
          type:
            - string
            - 'null'
          example: Прогон пикового дня, час 14 из 24
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
        result_url:
          type:
            - string
            - 'null'
          description: Куда идти за результатом, когда status=done
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
    VersionStamp:
      type: object
      description: Версии всего, от чего зависит результат. Позволяет воспроизвести расчёт (ТЗ 3.1.5).
      required:
        - project_version
        - catalog_version
        - norm_set_version
        - engine_version
        - computed_at
      properties:
        project_version:
          type: integer
          description: Растёт при каждом изменении параметров или планировки
        catalog_version:
          type: string
          example: 2026-09-22.3
        norm_set_version:
          type: string
          example: v1.2
        engine_version:
          type: string
          example: 0.4.0
        layout_version:
          type:
            - integer
            - 'null'
        computed_at:
          type: string
          format: date-time
        inputs_hash:
          type:
            - string
            - 'null'
          description: Хэш всех входов; одинаковый хэш = одинаковый результат
    ObjectType:
      type: object
      required:
        - key
        - name
        - industry
        - depth
        - parameter_groups
        - processes
      properties:
        key:
          $ref: '#/components/schemas/ObjectTypeKey'
        name:
          type: string
          example: Склад
        description:
          type: string
        industry:
          type: string
          example: Торговля и услуги
        depth:
          type: string
          description: full — расчёт, симуляция, отчёт; basic — параметры, подбор, аналитическая экономика без симуляции.
          enum:
            - full
            - basic
        demo_projects:
          type: array
          items:
            type: object
            required:
              - key
              - name
            properties:
              key:
                type: string
                example: warehouse_demo_01
              name:
                type: string
                example: Склад 20 000 м², 180 сотрудников (данные организатора)
              description:
                type: string
        parameter_groups:
          type: array
          items:
            $ref: '#/components/schemas/ParameterGroup'
        processes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessDef'
        layout_templates:
          type: array
          items:
            type: string
            example: warehouse_cross_dock
    ParameterDef:
      type: object
      description: Описание одного параметра объекта — по нему фронт строит форму, валидацию и подсказки (ТЗ 4.5.3).
      required:
        - key
        - name
        - type
        - required
      properties:
        key:
          type: string
          example: pallets_in_per_day
        name:
          type: string
          example: Приёмка паллет в сутки
        group:
          type: string
          example: operations
        type:
          type: string
          enum:
            - number
            - integer
            - string
            - boolean
            - enum
            - dimensions
        unit:
          type:
            - string
            - 'null'
          example: палл/сут
        required:
          type: boolean
        min:
          type:
            - number
            - 'null'
          example: 500
        max:
          type:
            - number
            - 'null'
          example: 5000
        step:
          type:
            - number
            - 'null'
        enum_values:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
        default:
          oneOf:
            - $ref: '#/components/schemas/PValue'
            - type: 'null'
        hint:
          type: string
          example: Среднее за рабочий день; пик задаётся отдельным коэффициентом
        example:
          type:
            - string
            - 'null'
          example: '1000'
        affects:
          type: array
          description: Какие процессы зависят от параметра — для подсветки «что пересчитается».
          items:
            type: string
        order:
          type: integer
    ProcessDef:
      type: object
      description: Процесс объекта, который можно роботизировать. Иерархия ТЗ 3.3.1 — отрасль → объект → процесс → тип решения → продукт.
      required:
        - key
        - name
        - demand_unit
        - solution_types
      properties:
        key:
          type: string
          example: pallet_transport
        name:
          type: string
          example: Перемещение паллет (приёмка → хранение → отгрузка)
        description:
          type: string
        demand_unit:
          $ref: '#/components/schemas/DemandUnit'
        demand_formula:
          type: string
          description: Человекочитаемая формула спроса
          example: приёмка + отгрузка, палл/сут
        sla:
          type:
            - object
            - 'null'
          properties:
            kind:
              type: string
              enum:
                - lead_time
                - on_time_share
                - coverage
            target_value:
              type: number
              example: 20
            target_param:
              type:
                - string
                - 'null'
              description: Параметр объекта, который задаёт цель (норматив доставки); расчёт сравнивает с ним рейс робота
            unit:
              type: string
              example: мин
        labor_groups:
          type: array
          description: Группы персонала, чей труд замещает роботизация процесса.
          items:
            type: string
            example: forklift_operators
        solution_types:
          type: array
          items:
            type: string
            example: amr_transport
        sizing_model:
          $ref: '#/components/schemas/SizingModel'
    Norm:
      type: object
      description: |
        Норматив расчётной модели. ТЗ 3.5.1 запрещает недокументированные коэффициенты — каждый норматив имеет источник
        и обоснование, и пользователь видит его в интерфейсе (ТЗ 3.2.5, 3.5.8).
      required:
        - key
        - name
        - value
        - unit
        - category
        - source
        - editable_by_user
      properties:
        key:
          type: string
          example: amr_utilization_target
        name:
          type: string
          example: Целевая загрузка AMR
        value:
          type: number
          example: 0.8
        unit:
          type: string
          example: доля
        category:
          $ref: '#/components/schemas/NormCategory'
        range:
          type:
            - object
            - 'null'
          properties:
            min:
              type: number
              example: 0.7
            max:
              type: number
              example: 0.85
        source:
          $ref: '#/components/schemas/Source'
        rationale:
          type: string
          example: 'Лист «Легенда» датасета организатора: загрузка AMR 70–85 %'
        affects:
          type: array
          items:
            type: string
          description: Ключи метрик, на которые влияет
        editable_by_user:
          type: boolean
          description: Можно ли переопределить в сценарии (ТЗ 3.5.3)
        object_types:
          type: array
          items:
            $ref: '#/components/schemas/ObjectTypeKey'
    Product:
      type: object
      description: Карточка продукта в списке.
      required:
        - id
        - name
        - manufacturer
        - solution_type
        - status
        - price_from
        - completeness
        - badges
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ronavi H1500
        manufacturer:
          $ref: '#/components/schemas/Manufacturer'
        solution_type:
          type: string
          example: amr_transport
        solution_type_name:
          type: string
          example: AMR — транспортный
        subtype:
          type:
            - string
            - 'null'
          example: Мобильный робот
        status:
          $ref: '#/components/schemas/ProductStatus'
        trl:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 9
          description: УГТ
        market_potential:
          type:
            - number
            - 'null'
          minimum: 1
          maximum: 5
        price_from:
          $ref: '#/components/schemas/Money'
        offers_count:
          type: integer
        badges:
          type: array
          items:
            $ref: '#/components/schemas/Badge'
        completeness:
          type: number
          minimum: 0
          maximum: 1
          description: Доля заполненных обязательных ТТХ
        image_url:
          type:
            - string
            - 'null'
          format: uri
        object_types:
          type: array
          items:
            $ref: '#/components/schemas/ObjectTypeKey'
        processes:
          type: array
          items:
            type: string
        short_description:
          type:
            - string
            - 'null'
        updated_at:
          type: string
          format: date-time
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required:
            - offers
            - specs
            - cases
            - sources
          properties:
            description:
              type:
                - string
                - 'null'
            offers:
              type: array
              items:
                $ref: '#/components/schemas/ProductOffer'
            specs:
              type: array
              description: Все характеристики, сгруппированы по group на фронте.
              items:
                $ref: '#/components/schemas/Spec'
            cases:
              type: array
              items:
                $ref: '#/components/schemas/ProductCase'
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
            integration_notes:
              type:
                - string
                - 'null'
              example: Интеграция с WMS по REST API вендора; QR-разметка пола
            missing_key_specs:
              type: array
              description: Ключевые ТТХ без данных — влияют на статус «требует проверки».
              items:
                type: string
            similar_products:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    Spec:
      type: object
      description: Одна характеристика продукта с единицей, группой и происхождением (ТЗ 3.3.4).
      required:
        - key
        - name
        - group
        - value
        - provenance
      properties:
        key:
          type: string
          example: payload_kg
        name:
          type: string
          example: Грузоподъёмность
        group:
          $ref: '#/components/schemas/SpecGroup'
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
            - type: 'null'
        unit:
          type:
            - string
            - 'null'
          example: кг
        provenance:
          $ref: '#/components/schemas/Provenance'
        is_key_constraint:
          type: boolean
          description: Участвует в жёстких проверках подбора
    Project:
      type: object
      required:
        - id
        - name
        - object_type
        - status
        - version
        - owner_id
        - created_at
        - updated_at
        - data_quality
        - scenarios_count
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: РЦ Подмосковье, 20 000 м²
        object_type:
          $ref: '#/components/schemas/ObjectTypeKey'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        version:
          type: integer
          description: Растёт при изменении параметров и планировки; расчёты ссылаются на версию
        owner_id:
          type: string
          format: uuid
          description: Автор проекта
        organization_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Организация, чьим участникам виден проект; null — личный проект автора.
        organization:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        data_quality:
          $ref: '#/components/schemas/DataQualitySummary'
        scenarios_count:
          type: integer
        last_calculation_id:
          type:
            - string
            - 'null'
          format: uuid
        recommended_scenario_id:
          type:
            - string
            - 'null'
          format: uuid
        headline_metrics:
          type:
            - object
            - 'null'
          description: Короткая сводка для карточки в списке (если есть расчёт).
          properties:
            payback_years:
              type:
                - number
                - 'null'
            capex_rub:
              type:
                - number
                - 'null'
            effect_rub_year:
              type:
                - number
                - 'null'
            verdict:
              type:
                - string
                - 'null'
        is_demo:
          type: boolean
          default: false
    ProjectParam:
      type: object
      description: Параметр объекта в проекте — значение, происхождение, валидация, история правок.
      required:
        - key
        - name
        - group
        - value
        - provenance
        - validation
      properties:
        key:
          type: string
          example: aisle_width_m
        name:
          type: string
          example: Ширина рабочих проходов
        group:
          type: string
          example: site
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
            - type: 'null'
        unit:
          type:
            - string
            - 'null'
          example: м
        provenance:
          $ref: '#/components/schemas/Provenance'
        validation:
          $ref: '#/components/schemas/ParamValidation'
        definition:
          $ref: '#/components/schemas/ParameterDef'
        history_count:
          type: integer
          default: 0
        sensitivity_rank:
          type:
            - integer
            - 'null'
          description: Место в торнадо последнего расчёта, если есть
    ProcessDemand:
      type: object
      description: '«Где деньги»: спрос и текущая стоимость процесса. Строится из параметров до подбора.'
      required:
        - process_key
        - name
        - demand_unit
        - demand_per_day
        - peak_per_hour
        - avg_per_hour
        - robotizable
      properties:
        process_key:
          type: string
          example: order_picking
        name:
          type: string
          example: Отбор заказов
        demand_unit:
          $ref: '#/components/schemas/DemandUnit'
        demand_per_day:
          type:
            - number
            - 'null'
          example: 100000
          description: null — не хватает параметров для оценки спроса
        avg_per_hour:
          type:
            - number
            - 'null'
          example: 4545
        peak_per_hour:
          type:
            - number
            - 'null'
          example: 6818
        hourly_profile:
          type:
            - array
            - 'null'
          minItems: 24
          maxItems: 24
          items:
            type: number
          description: Доли суточного объёма по часам (сумма = 1). Источник профиля — допущение с источником.
        profile_provenance:
          oneOf:
            - $ref: '#/components/schemas/Provenance'
            - type: 'null'
        current:
          type: object
          description: Как процесс выполняется сейчас.
          properties:
            labor_groups:
              type: array
              items:
                $ref: '#/components/schemas/LaborGroup'
            fte:
              type: number
            cost_rub_year:
              type: number
            productivity_per_hour:
              type:
                - number
                - 'null'
              description: На одного сотрудника
            sla_now:
              type:
                - number
                - 'null'
              description: Доля вовремя, если оценима
        share_of_labor_cost:
          type: number
          minimum: 0
          maximum: 1
        robotizable:
          type: boolean
        solution_types:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
    Layout:
      type: object
      description: |
        Планировка объекта — единая модель для 2D-карты и графа маршрутов симуляции. Генерируется из параметров,
        пользователь может подправить зоны и станции в простом редакторе. Не CAD. Сохранение или перегенерация
        повышает версию проекта: расчёты становятся stale.
      required:
        - id
        - project_id
        - version
        - width_m
        - height_m
        - zones
        - nodes
        - edges
        - generated
        - stats
        - derivation
        - warnings
        - params_changed
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        version:
          type: integer
        template:
          oneOf:
            - $ref: '#/components/schemas/LayoutTemplate'
            - type: 'null'
        width_m:
          type: number
          example: 200
        height_m:
          type: number
          example: 100
        background_image:
          oneOf:
            - $ref: '#/components/schemas/FileRef'
            - type: 'null'
          description: url ведёт на GET …/layout/background
        background_scale_m_per_px:
          type:
            - number
            - 'null'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
        racks:
          type: array
          items:
            $ref: '#/components/schemas/Rack'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/LayoutNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/LayoutEdge'
        generated:
          type: boolean
          description: false — после ручной правки в редакторе
        generator:
          type: object
          properties:
            template:
              type: string
            seed:
              type:
                - integer
                - 'null'
            overrides:
              type: object
              additionalProperties:
                type: number
            params:
              type: object
              additionalProperties:
                type: number
              description: Значения параметров и нормативов, использованные генератором
            project_version:
              type: integer
        stats:
          $ref: '#/components/schemas/LayoutStats'
        derivation:
          type: array
          items:
            $ref: '#/components/schemas/LayoutDerivationStep'
        warnings:
          type: array
          items:
            type: string
          example:
            - В здании помещается 19 500 из 20 000 паллетомест при 5 ярусах — проверьте высоту потолков и площадь
        params_changed:
          type: boolean
          description: Параметры объекта менялись после генерации — стоит перегенерировать
        updated_at:
          type: string
          format: date-time
    LayoutPlan:
      type: object
      description: |
        Геометрия планировки, на которой прошла имитация: прогон хранит свою копию, поэтому реплей показывает
        ровно ту схему, по которой считался, даже если планировку проекта потом изменили.
      required:
        - width_m
        - height_m
        - zones
        - racks
        - nodes
        - edges
      properties:
        width_m:
          type: number
          example: 200
        height_m:
          type: number
          example: 100
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
        racks:
          type: array
          items:
            $ref: '#/components/schemas/Rack'
