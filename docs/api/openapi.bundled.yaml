    SizingResult:
      type: object
      description: Как получилось число роботов для процесса — сердце «паспорт против физики».
      required:
        - process_key
        - product_id
        - demand_peak_per_hour
        - robot
        - count
      properties:
        process_key:
          type: string
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        demand_peak_per_hour:
          type: number
        demand_avg_per_hour:
          type: number
        robot:
          type: object
          required:
            - cycle_time_s
            - effective_throughput_per_hour
          properties:
            cycle_components:
              type: array
              description: Из чего состоит цикл — показываем таблицей.
              items:
                type: object
                required:
                  - key
                  - name
                  - seconds
                properties:
                  key:
                    type: string
                    example: travel_loaded
                  name:
                    type: string
                    example: Пробег с грузом (68 м при 1,2 м/с)
                  seconds:
                    type: number
                  inputs:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraceInput'
            cycle_time_s:
              type:
                - number
                - 'null'
              description: null — у модели нет цикла (площадь, станция) или количество задано вручную
            nominal_throughput_per_hour:
              type:
                - number
                - 'null'
              description: 3600 / цикл
            availability:
              type: number
              description: Доля времени в работе с учётом зарядки и простоев
            utilization_target:
              type:
                - number
                - 'null'
            effective_throughput_per_hour:
              type:
                - number
                - 'null'
            vendor_claim_per_hour:
              type:
                - number
                - 'null'
              description: Заявка производителя — для сравнения
        count:
