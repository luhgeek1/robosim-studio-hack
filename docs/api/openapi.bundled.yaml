                  - type: string
                  - type: 'null'
              unit:
                type:
                  - string
                  - 'null'
              swing:
                type: number
                description: Размах NPV, ₽, при изменении входа по его диапазону (норматив) или на ±20 % (параметр объекта)
              rank:
                type: integer
              recommendation:
                type: string
                example: Замерить фактическое время цикла погрузчика на приёмке за 2 смены
              how_to_measure:
                type:
