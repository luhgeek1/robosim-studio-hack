  /api/v1/admin/catalog/import:
    post:
      tags:
        - admin
      operationId: adminImportCatalog
      summary: Загрузить таблицу решений организатора (CSV) — новая версия каталога (ТЗ 3.3.2, 3.3.6)
      description: |
        Формат `catalog_export_v4.csv` (разделитель «;», UTF-8 или cp1251). Продукты под управлением сида
        обновляются, новые id добавляются (тип решения — по тому, как файл классифицирует уже известные продукты;
        процессы назначает админ), карточки, которые правил или скрыл администратор, не перезаписываются —
        они в `items` с `action: conflict`. Изменение поднимает версию каталога, сохранённые расчёты устаревают.
        С `dry_run=true` ничего не пишет: тот же ответ — предпросмотр.
      parameters:
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
          description: 'Только предпросмотр: ничего не сохранять'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                notes:
                  type: string
                  maxLength: 2000
                  description: Что за выгрузка — пишется в журнал
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportResult'
        '413':
          description: Файл больше 20 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Неподдерживаемый формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
