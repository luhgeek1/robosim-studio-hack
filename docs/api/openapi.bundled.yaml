  /api/v1/simulations/{simulation_id}/replay:
    get:
      tags:
        - simulation
      operationId: getSimulationReplay
      summary: Журнал событий для 2D-плеера (постранично по времени)
      description: |
        Плеер запрашивает окно `[from_s, to_s)`, интерполирует движение по рёбрам планировки и держит буфер на следующее окно.
        Первый запрос — с from_s=0; в ответе есть `tasks_snapshot` для стартового состояния.
      parameters:
        - $ref: '#/components/parameters/SimulationId'
        - name: from_s
          in: query
          schema:
            type: number
            default: 0
        - name: to_s
          in: query
          schema:
            type: number
          description: По умолчанию from_s + 3600
        - name: robots
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Фильтр по роботам
