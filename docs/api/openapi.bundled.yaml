                type: string
              kind:
                type: string
                enum:
                  - param
                  - norm
                  - catalog
                  - group
                description: catalog — цена оборудования; group — группа параметров (все зарплаты, все объёмы)
              unit:
                type:
                  - string
                  - 'null'
              base_input:
                type: number
              low_input:
                type: number
              high_input:
                type: number
              metric_at_low:
                type:
                  - number
                  - 'null'
              metric_at_high:
                type:
                  - number
                  - 'null'
              swing:
                type: number
                description: Размах метрики запроса (metric_at_high − metric_at_low по модулю) в её единицах; для окупаемости годы за горизонтом считаются равными горизонту
              rank:
                type: integer
              provenance_status:
                oneOf:
                  - $ref: '#/components/schemas/ProvenanceStatus'
                  - type: 'null'
                description: null — группа параметров
        heatmap:
          type:
