name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.11.8
      - name: Run backend and API contract checks
        run: make check
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 60 db redis

  frontend-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend types, lint, formatting and production build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check

  deploy:
    needs: [check, frontend-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Check deploy credentials
        run: |
          test -n "$FLY_API_TOKEN_BACKEND" || { echo "Missing FLY_API_TOKEN_BACKEND secret"; exit 1; }
          test -n "$FLY_API_TOKEN_WEB" || { echo "Missing FLY_API_TOKEN_WEB secret"; exit 1; }
        env:
          FLY_API_TOKEN_BACKEND: ${{ secrets.FLY_API_TOKEN_BACKEND }}
          FLY_API_TOKEN_WEB: ${{ secrets.FLY_API_TOKEN_WEB }}
      - name: Deploy API and worker with database migrations
        run: >-
          flyctl deploy . --config deploy/fly/api.toml --dockerfile backend/Dockerfile
          --remote-only --ha=false --yes --env RS_BUILD_SHA="$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BACKEND }}
      - name: Deploy frontend
        run: >-
          flyctl deploy . --config deploy/fly/web.toml --dockerfile deploy/fly/frontend.Dockerfile
          --remote-only --ha=false --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
      - name: Verify public site, dependencies and deployed revision
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.request

          base = "https://prooood.ru"
          expected_sha = os.environ["GITHUB_SHA"]
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(base + "/", timeout=15) as response:
                      assert response.status == 200, "Frontend is unavailable"
                  with urllib.request.urlopen(base + "/api/v1/ready", timeout=15) as response:
                      ready = json.load(response)
                  assert ready["status"] == "ok", ready
                  for service in ("database", "redis", "worker"):
                      assert ready["checks"].get(service) == "ok", ready
                  with urllib.request.urlopen(base + "/api/v1/version", timeout=15) as response:
                      version = json.load(response)
                  assert version["build_sha"] == expected_sha, version
                  with urllib.request.urlopen(base + "/demo/warehouse_demo_01", timeout=15) as response:
                      assert response.status == 200, "Public demo page is unavailable"
                  with urllib.request.urlopen(base + "/api/v1/demo/projects", timeout=15) as response:
                      examples = json.load(response)
                  assert len(examples["items"]) >= 4, "Public examples are missing"
                  with urllib.request.urlopen(base + "/api/v1/demo/projects/warehouse_demo_01", timeout=15) as response:
                      assert response.status == 200, "Public demo is still preparing"
                      demo = json.load(response)
                  assert demo["calculations"] and demo["simulation"], "Public demo is incomplete"
                  print(f"Deployment verified: {expected_sha}")
                  break
              except Exception as error:
                  print(f"Readiness attempt {attempt + 1}/24 failed: {error}", flush=True)
                  if attempt == 23:
                      raise
                  time.sleep(5)
          PYTHON
