map $uri $log_public_request {
    default 1;
    ~^/api/v1/auth/oauth/[^/]+/callback/?$ 0;
}

server {
    listen 8080;
    access_log /dev/stdout combined if=$log_public_request;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://robomera-api.flycast;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the public edge client across the second (private Flycast) proxy.
        # Overwrite any caller-supplied value; the API trusts this header only on its private service.
        proxy_set_header X-Robomera-Client-IP $http_fly_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # SSE progress streams must not be buffered.
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /privacy {
        absolute_redirect off;
        return 301 /privacy/;
    }

    location /privacy/ {
        try_files $uri $uri/ =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
